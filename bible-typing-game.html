<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>성경 필사 타자 게임</title>

    <meta
            name="description"
            content="성경 말씀을 따라 입력하며 타자 연습을 할 수 있는 무료 성경 필사 게임입니다."
    >
    <meta
            name="keywords"
            content="성경 필사, 성경 타자, 타자 연습, 타이핑 게임, 성경 게임"
    >

    <meta property="og:title" content="성경 필사 타자 게임">
    <meta
            property="og:description"
            content="성경 말씀을 따라 입력하며 즐기는 무료 타자 연습 게임"
    >
    <meta property="og:type" content="website">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.webmanifest">

    <style>
        :root {
            --color-bg: #f6faf7;
            --color-surface: #ffffff;
            --color-primary: #2e7d32;
            --color-primary-dark: #1b5e20;
            --color-primary-soft: #e8f5e9;
            --color-primary-hover: #d8efda;
            --color-accent: #ef6c00;
            --color-accent-hover: #e65100;
            --color-danger: #c62828;
            --color-danger-soft: #ffebee;
            --color-text: #202124;
            --color-muted: #6b7280;
            --color-border: #e5e7eb;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            --radius: 24px;
            --radius-small: 14px;
            --max-width: 760px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background: var(--color-bg);
            color: var(--color-text);
            font-family:
                    "Malgun Gothic",
                    "Apple SD Gothic Neo",
                    Arial,
                    sans-serif;
            line-height: 1.6;
            letter-spacing: -0.03em;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: min(100% - 32px, var(--max-width));
            margin: 0 auto;
            padding: 48px 0 40px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .app-title {
            margin: 0;
            color: var(--color-primary-dark);
            font-size: clamp(26px, 5vw, 36px);
            font-weight: 800;
            line-height: 1.25;
        }

        .app-description {
            margin: 10px 0 0;
            color: var(--color-muted);
            font-size: 15px;
        }

        .mode-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .timer-button,
        .back-button,
        .book-button {
            border: 0;
            cursor: pointer;
            transition:
                    transform 0.15s ease,
                    background-color 0.15s ease,
                    box-shadow 0.15s ease;
        }

        .timer-button:active,
        .back-button:active,
        .book-button:active {
            transform: translateY(1px);
        }

        .timer-button {
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--color-accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(239, 108, 0, 0.18);
        }

        .timer-button:hover {
            background: var(--color-accent-hover);
        }

        .mode-guide {
            margin: 0;
            color: var(--color-muted);
            font-size: 13px;
            text-align: center;
        }

        .navigation {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .back-button {
            min-height: 40px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #eef1ee;
            color: #374151;
            font-size: 14px;
            font-weight: 700;
        }

        .back-button:hover {
            background: #e2e7e2;
        }

        .timer-display {
            margin-left: auto;
            color: var(--color-danger);
            font-size: 15px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .hidden {
            display: none !important;
        }

        .card {
            min-height: 410px;
            padding: 26px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            background: var(--color-surface);
            box-shadow: var(--shadow);
        }

        .book-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .book-button {
            min-height: 56px;
            padding: 12px 8px;
            border: 1px solid #dceadd;
            border-radius: var(--radius-small);
            background: var(--color-primary-soft);
            color: var(--color-primary-dark);
            font-size: 15px;
            font-weight: 800;
        }

        .book-button:hover {
            background: var(--color-primary-hover);
            box-shadow: 0 6px 14px rgba(46, 125, 50, 0.08);
        }

        .typing-screen {
            width: 100%;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .section-title {
            margin-bottom: 12px;
            color: var(--color-primary-dark);
            font-size: 20px;
            font-weight: 800;
        }

        .verse-reference {
            margin-bottom: 10px;
            color: var(--color-primary);
            font-size: 14px;
            font-weight: 800;
        }

        .verse-text {
            width: 100%;
            max-width: 640px;
            margin-bottom: 24px;
            color: #2f3337;
            font-family:
                    "Batang",
                    "AppleMyungjo",
                    serif;
            font-size: clamp(17px, 3vw, 20px);
            line-height: 1.85;
            word-break: keep-all;
        }

        .typing-input {
            width: 100%;
            max-width: 620px;
            min-height: 52px;
            padding: 13px 16px;
            border: 2px solid var(--color-border);
            border-radius: var(--radius-small);
            outline: none;
            background: #ffffff;
            color: var(--color-text);
            font-size: 16px;
            text-align: center;
            transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease,
                    background-color 0.15s ease;
        }

        .typing-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
        }

        .typing-input.is-error {
            border-color: var(--color-danger);
            background: var(--color-danger-soft);
            animation: shake 0.18s ease;
        }

        .typing-input:disabled {
            cursor: not-allowed;
            background: #f3f4f6;
        }

        .guide-text {
            margin: 12px 0 0;
            color: var(--color-muted);
            font-size: 13px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 4px 0;
            color: var(--color-primary-dark);
            font-size: 14px;
            font-weight: 800;
        }

        .status-bar span:last-child {
            text-align: right;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-4px);
            }
            75% {
                transform: translateX(4px);
            }
        }

        @media (max-width: 640px) {
            .app {
                width: min(100% - 20px, var(--max-width));
                padding-top: 28px;
            }

            .card {
                min-height: 360px;
                padding: 18px;
                border-radius: 20px;
            }

            .book-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .book-button {
                min-height: 52px;
            }

            .navigation {
                min-height: 40px;
            }

            .status-bar {
                flex-direction: column;
                gap: 2px;
            }

            .status-bar span:last-child {
                text-align: left;
            }
        }

        @media (max-width: 380px) {
            .book-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>

<body>
<main class="app">
    <header class="app-header">
        <h1 class="app-title">🐑 성경 필사 타자 게임</h1>
        <p class="app-description">
            말씀을 천천히 읽고 정확하게 따라 입력해 보세요.
        </p>
    </header>

    <section class="mode-panel" id="modePanel" aria-label="게임 모드 선택">
        <button
                class="timer-button"
                id="timerModeButton"
                type="button"
        >
            ⏳ 1분 타임어택 시작
        </button>

        <p class="mode-guide" id="modeGuide">
            또는 아래에서 일반 필사 책을 선택하세요.
        </p>
    </section>

    <nav class="navigation" aria-label="필사 화면 탐색">
        <button
                class="back-button hidden"
                id="backButton"
                type="button"
        >
            ← 책 목록
        </button>

        <div
                class="timer-display"
                id="timerDisplay"
                aria-live="polite"
        ></div>
    </nav>

    <section
            class="card"
            id="cardContainer"
            aria-live="polite"
    ></section>

    <footer class="status-bar">
        <span id="progressLabel"></span>
        <span id="charCountLabel">누적 필사 글자 수: 0자</span>
    </footer>
</main>

    const TIMER_DURATION = 60;

    const state = {
        currentBook: null,
        currentVerseIndex: 0,
        currentVerseBody: "",
        isTimerMode: false,
        timerSeconds: TIMER_DURATION,
        timerId: null,
        typedCharsCount: 0
    };

    const elements = {
        modePanel: document.getElementById("modePanel"),
        timerModeButton: document.getElementById("timerModeButton"),
        modeGuide: document.getElementById("modeGuide"),
        backButton: document.getElementById("backButton"),
        timerDisplay: document.getElementById("timerDisplay"),
        cardContainer: document.getElementById("cardContainer"),
        progressLabel: document.getElementById("progressLabel"),
        charCountLabel: document.getElementById("charCountLabel")
    };

    function clearTimer() {
        if (state.timerId !== null) {
            window.clearInterval(state.timerId);
            state.timerId = null;
        }
    }

    function resetPracticeState() {
        clearTimer();

        state.currentBook = null;
        state.currentVerseIndex = 0;
        state.currentVerseBody = "";
        state.isTimerMode = false;
        state.timerSeconds = TIMER_DURATION;
    }

    function setPracticeControlsVisible(isPractice) {
        elements.modePanel.classList.toggle("hidden", isPractice);
        elements.backButton.classList.toggle("hidden", !isPractice);

        if (!isPractice) {
            elements.timerDisplay.textContent = "";
        }
    }

    function updateCharCount() {
        elements.charCountLabel.textContent =
            `누적 필사 글자 수: ${state.typedCharsCount}자`;
    }

    function createBookButton(bookName) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "book-button";
        button.dataset.book = bookName;
        button.textContent = bookName;

        return button;
    }

    function renderBookList() {
        resetPracticeState();
        setPracticeControlsVisible(false);

        elements.progressLabel.textContent = "";
        elements.cardContainer.replaceChildren();

        const grid = document.createElement("div");
        grid.className = "book-grid";

        Object.keys(bibleData).forEach(function (bookName) {
            grid.appendChild(createBookButton(bookName));
        });

        elements.cardContainer.appendChild(grid);
    }

    function renderTypingScreen(title) {
        elements.cardContainer.innerHTML = `
                <div class="typing-screen">
                    <div class="section-title">${escapeHtml(title)}</div>
                    <div class="verse-reference" id="verseReference"></div>
                    <div class="verse-text" id="verseText"></div>

                    <input
                        class="typing-input"
                        id="typingInput"
                        type="text"
                        placeholder="말씀을 입력하고 Enter를 누르세요"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-label="성경 말씀 입력"
                    >

                    <p class="guide-text">
                        말씀을 정확히 입력한 뒤 Enter 키를 누르세요.
                    </p>
                </div>
            `;

        const typingInput = getTypingInput();

        typingInput.addEventListener("keydown", function (event) {
            if (event.key !== "Enter") {
                return;
            }

            event.preventDefault();
            checkVerseInput();
        });

        typingInput.focus();
    }

    function startVersePractice(bookName) {
        if (!Object.prototype.hasOwnProperty.call(bibleData, bookName)) {
            return;
        }

        clearTimer();

        state.currentBook = bookName;
        state.currentVerseIndex = 0;
        state.currentVerseBody = "";
        state.isTimerMode = false;

        setPracticeControlsVisible(true);
        elements.timerDisplay.textContent = "";

        renderTypingScreen(bookName);
        loadNextVerse();
    }

    function startTimerMode() {
        clearTimer();

        state.currentBook = "1분 타임어택";
        state.currentVerseIndex = 0;
        state.currentVerseBody = "";
        state.isTimerMode = true;
        state.timerSeconds = TIMER_DURATION;
        state.typedCharsCount = 0;

        updateCharCount();
        setPracticeControlsVisible(true);
        renderTypingScreen(state.currentBook);
        updateTimerDisplay();
        loadRandomVerse();

        state.timerId = window.setInterval(function () {
            state.timerSeconds -= 1;
            updateTimerDisplay();

            if (state.timerSeconds <= 0) {
                finishTimerMode();
            }
        }, 1000);
    }

    function finishTimerMode() {
        clearTimer();

        const typingInput = getTypingInput();

        if (typingInput) {
            typingInput.disabled = true;
        }

        window.alert(
            `시간 종료! 1분 동안 총 ${state.typedCharsCount}자의 말씀을 필사하셨습니다.`
        );

        renderBookList();
    }

    function updateTimerDisplay() {
        elements.timerDisplay.textContent =
            `⏱ 남은 시간: ${state.timerSeconds}초`;
    }

    function parseVerse(fullText, fallbackBookName) {
        const match = fullText.match(/^(.*?)\s*\(([^()]*)\)\s*$/);

        if (!match) {
            return {
                body: fullText.trim(),
                reference: `(${fallbackBookName})`
            };
        }

        return {
            body: match[1].trim(),
            reference: `(${match[2].trim()})`
        };
    }

    function displayVerse(fullText, fallbackBookName) {
        const verse = parseVerse(fullText, fallbackBookName);
        const verseReference = document.getElementById("verseReference");
        const verseText = document.getElementById("verseText");
        const typingInput = getTypingInput();

        state.currentVerseBody = verse.body;

        verseReference.textContent = verse.reference;
        verseText.textContent = verse.body;

        if (typingInput) {
            typingInput.value = "";
            typingInput.classList.remove("is-error");
            typingInput.focus();
        }
    }

    function loadNextVerse() {
        const verses = bibleData[state.currentBook];

        if (!verses) {
            renderBookList();
            return;
        }

        if (state.currentVerseIndex >= verses.length) {
            window.alert(
                `[${state.currentBook}] 모든 구절 필사를 완료했습니다!`
            );
            renderBookList();
            return;
        }

        displayVerse(
            verses[state.currentVerseIndex],
            state.currentBook
        );

        elements.progressLabel.textContent =
            `진행도: ${state.currentVerseIndex + 1} / ${verses.length}`;
    }

    function loadRandomVerse() {
        const bookNames = Object.keys(bibleData);
        const randomBook =
                  bookNames[Math.floor(Math.random() * bookNames.length)];
        const verses = bibleData[randomBook];
        const randomVerse =
                  verses[Math.floor(Math.random() * verses.length)];

        displayVerse(randomVerse, randomBook);
        elements.progressLabel.textContent = `랜덤 말씀 · ${randomBook}`;
    }

    function checkVerseInput() {
        const typingInput = getTypingInput();

        if (!typingInput || typingInput.disabled) {
            return;
        }

        const userText = typingInput.value.trim();

        if (userText === state.currentVerseBody) {
            state.typedCharsCount += userText.length;
            updateCharCount();

            if (state.isTimerMode) {
                loadRandomVerse();
                return;
            }

            state.currentVerseIndex += 1;
            loadNextVerse();
            return;
        }

        showInputError(typingInput);
    }

    function showInputError(input) {
        input.classList.remove("is-error");

        window.requestAnimationFrame(function () {
            input.classList.add("is-error");
        });

        window.setTimeout(function () {
            input.classList.remove("is-error");
        }, 220);
    }

    function getTypingInput() {
        return document.getElementById("typingInput");
    }

    function escapeHtml(value) {
        return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    elements.cardContainer.addEventListener("click", function (event) {
        const bookButton = event.target.closest(".book-button");

        if (!bookButton) {
            return;
        }

        startVersePractice(bookButton.dataset.book);
    });

    elements.timerModeButton.addEventListener("click", startTimerMode);
    elements.backButton.addEventListener("click", renderBookList);

    renderBookList();
</script>
</body>
