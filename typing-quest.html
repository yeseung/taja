            0% {

            100% {

    // --- SoundSynthesizer (Web Audio API) ---
    class SoundFX {
        constructor() {
            this.ctx = null;
            this.enabled = true;
            this.soundProfile = "mechanical";
        }

        initCtx() {
            if (!this.ctx && typeof window !== "undefined") {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (AudioCtx) this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === "suspended") {
                this.ctx.resume();
            }
        }

        playTones(tones) {
            if (!this.enabled) return;
            this.initCtx();
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            tones.forEach(
                ({
                     type = "sine",
                     frequency,
                     endFrequency,
                     volume,
                     duration,
                     delay = 0,
                 }) => {
                    const startTime = now + delay;
                    const endTime = startTime + duration;

                    try {
                        const oscillator = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        oscillator.type = type;
                        oscillator.frequency.setValueAtTime(frequency, startTime);
                        if (endFrequency) {
                            oscillator.frequency.exponentialRampToValueAtTime(
                                endFrequency,
                                endTime,
                            );
                        }
                        gain.gain.setValueAtTime(volume, startTime);
                        gain.gain.linearRampToValueAtTime(0.0001, endTime);
                        oscillator.connect(gain);
                        gain.connect(this.ctx.destination);
                        oscillator.start(startTime);
                        oscillator.stop(endTime);
                    } catch (error) {
                        console.error("Failed to play sound effect:", error);
                    }
                },
            );
        }

        playKeyClick(profile = this.soundProfile) {
            if (!this.enabled) return;
            let tones;
            if (profile === "mechanical") {

                        endFrequency: 120,
                        volume      : 0.3,
                        duration    : 0.06,
                    },
                ];
            } else if (profile === "bubble") {
                tones = [

                        frequency   : 900 + Math.random() * 200,
                        endFrequency: 320,
                        volume      : 0.28,
                        duration    : 0.06,
                    },

            } else if (profile === "typewriter") {

                        type        : "square",
                        frequency   : 1800 + Math.random() * 300,
                        endFrequency: 180,
                        volume      : 0.18,
                        duration    : 0.045,
                    },
                ];
            } else {

                    {
                        frequency   : 950 + Math.random() * 150,
                        endFrequency: 250,
                        volume      : 0.25,
                        duration    : 0.05,
                    },
                ];
            }

            this.playTones(tones);
        }

                    volume  : 0.22,
                    duration: 0.12,
                    delay   : index * 0.05,
                })),

        }

        playErrorSound() {

                    volume      : 0.15,

                    duration    : 0.15,

        playVictorySound() {

                    volume  : 0.28,
                    duration: 0.25,
                    delay   : index * 0.08,
                })),
            );
        }
    }

        const [selectedQuestId, setSelectedQuestId] = useState("quest_cafe");

        const [stats, setStats] = useState(() =>
            loadStoredJson(STORAGE_KEYS.stats, DEFAULT_STATS),
        );
        const [history, setHistory] = useState(() =>
            loadStoredJson(STORAGE_KEYS.history, []),
        );

        const [shopItems, setShopItems] = useState(INITIAL_SHOP_ITEMS);
        const [showClassModal, setShowClassModal] = useState(false);
        const [showGmChat, setShowGmChat] = useState(false);
        const [showDonateModal, setShowDonateModal] = useState(false);
        const [showInfoModal, setShowInfoModal] = useState(false);
        const [toastMessage, setToastMessage] = useState(null);

        const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => {
                setToastMessage((prev) => (prev === msg ? null : prev));
            }, 3500);
        };

        const handleSelectLangMode = (langItem) => {
            const questData = FOREIGN_LANG_QUESTS[langItem.code];
            if (questData) {
                setQuests((prevQuests) => {
                    const exists = prevQuests.some((q) => q.id === questData.id);
                    if (!exists) {
                        return [questData, ...prevQuests];
                    }
                    return prevQuests;
                });
                setSelectedQuestId(questData.id);
            }

            try {
                soundFX.playWordSuccessSound();
            } catch (e) {
            }

            const notification =
                      lang === "en"
                          ? `🌐 Switched to ${langItem.nameEn} Mode!`
                          : `🌐 สลับเป็นโหมดฝึกภาษา${langItem.nameTh} เรียบร้อย!`;
            showToast(notification);

            setShowInfoModal(false);
        };

        useEffect(() => {
            saveStoredJson(STORAGE_KEYS.stats, stats);
        }, [stats]);

        useEffect(() => {
            saveStoredJson(STORAGE_KEYS.history, history);
        }, [history]);

        const activeQuest =
                  quests.find((q) => q.id === selectedQuestId) || quests[0];

        const handleQuestComplete = (log) => {
            try {
                soundFX.playVictorySound();

                const updatedHistory = [log, ...history];
                setHistory(updatedHistory);

                setStats((prev) => {
                    const newXp = prev.xp + log.xpEarned;
                    let newLevel = prev.level;
                    let newMaxXp = prev.maxXp;
                    if (newXp >= prev.maxXp) {
                        newLevel += 1;
                        newMaxXp = Math.round(prev.maxXp * 1.5);
                    }
                    const totalQuests = (prev.completedQuestsCount || 0) + 1;
                    const avgWpm = Math.round(
                        ((prev.wpm || 0) * (prev.completedQuestsCount || 0) + log.wpm) /
                        totalQuests,
                    );
                    const avgAcc = Math.round(
                        ((prev.accuracy || 100) * (prev.completedQuestsCount || 0) +
                            log.accuracy) /
                        totalQuests,
                    );
                    const newTotalTyped =
                              (prev.totalTypedChars || 0) + (log.totalChars || 0);

                    const updatedStats = {
                        ...prev,
                        gold                : prev.gold + log.goldEarned,
                        xp                  : newXp,
                        level               : newLevel,
                        maxXp               : newMaxXp,
                        wpm                 : avgWpm,
                        accuracy            : avgAcc,
                        totalTypedChars     : newTotalTyped,
                        completedQuestsCount: totalQuests,
                        currentHp           : prev.maxHp,
                    };

                    // Explicit synchronous localStorage save for maximum reliability
                    try {
                        saveStoredJson(STORAGE_KEYS.stats, updatedStats);
                        saveStoredJson(STORAGE_KEYS.history, updatedHistory);
                    } catch (err) {
                        console.error(
                            "LocalStorage save error in handleQuestComplete:",
                            err,
                        );
                    }

                    return updatedStats;
                });
            } catch (error) {
                console.error("Error during finish game logic:", error);
                alert("เกิดข้อผิดพลาดในการอัปเดตสถิติการเล่น กรุณาลองใหม่อีกครั้ง");
            }
        };

        const handleBuyItem = (itemId, cost) => {
            if (stats.gold < cost) return;
            soundFX.playKeyClick();
            setStats((prev) => ({...prev, gold: prev.gold - cost}));
            setShopItems((prev) =>
                prev.map((item) =>
                    item.id === itemId
                        ? {...item, quantity: item.quantity + 1}
                        : item,
                ),
            );
        };

        const handleSelectClass = (className, avatar) => {
            setStats((prev) => ({...prev, characterClass: className, avatar}));
        };

    // --- Typing Arena View Component ---
    function shuffleSentencePairs(sentences, translations) {
        const pairs = sentences.map((sentence, index) => ({
            sentence,
            translation: translations[index] || "",
        }));

        for (let index = pairs.length - 1; index > 0; index--) {
            const swapIndex = Math.floor(Math.random() * (index + 1));
            [pairs[index], pairs[swapIndex]] = [pairs[swapIndex], pairs[index]];
        }

        return {
            sentences   : pairs.map((pair) => pair.sentence),
            translations: pairs.map((pair) => pair.translation),
        };
    }

    function getQuestSentenceSet(quest, use108Pool, shouldShuffle) {
        const sentences = use108Pool
            ? MASTER_SENTENCES_108.map(({sentence}) => sentence)
            : [...(quest.sentences || [])];
        const translations = use108Pool
            ? MASTER_SENTENCES_108.map(({translation}) => translation)
            : [...(quest.sentenceTranslations || [])];

        return shouldShuffle && sentences.length > 1
            ? shuffleSentencePairs(sentences, translations)
            : {sentences, translations};
    }

    function createTranslationsMap(translations) {
        return translations.reduce((map, translation, index) => {
            map[index] = translation;
            return map;
        }, {});
    }

    function TypingArenaView({
                                 quest,
                                 stats,
                                 lang,
                                 onQuestComplete,
                                 onOpenGmChat,
                                 onQuestRetry,
                             }) {
        const isEn = lang === "en";
        const [currentSentenceIdx, setCurrentSentenceIdx] = useState(0);
        const [typedInput, setTypedInput] = useState("");
        const [totalErrors, setTotalErrors] = useState(0);
        const [totalCorrectChars, setTotalCorrectChars] = useState(0);
        const [combo, setCombo] = useState(0);
        const [enemyHp, setEnemyHp] = useState(quest.enemyHP);
        const [playerHp, setPlayerHp] = useState(stats.currentHp);
        const [startTime, setStartTime] = useState(null);
        const [elapsedSec, setElapsedSec] = useState(0);
        const [isCompleted, setIsCompleted] = useState(false);
        const [isFailed, setIsFailed] = useState(false);
        const [autoTTS, setAutoTTS] = useState(true);
        const [sfxEnabled, setSfxEnabled] = useState(true);
        const [soundProfile, setSoundProfile] = useState("mechanical"); // mechanical, bubble, typewriter, digital
        const [isRandomized, setIsRandomized] = useState(false);
        const [use108Pool, setUse108Pool] = useState(false);
        const [activeSentences, setActiveSentences] = useState(
            quest.sentences || [],
        );
        const [activeTranslations, setActiveTranslations] = useState(
            quest.sentenceTranslations || [],
        );
        const [translationsMap, setTranslationsMap] = useState({});
        const [lastCompletedSentenceToast, setLastCompletedSentenceToast] =
                  useState(null);
        const [selectedSlang, setSelectedSlang] = useState(null);
        const [selectedTypo, setSelectedTypo] = useState(null);

        const inputRef = useRef(null);
        const currentSentence = activeSentences[currentSentenceIdx] || "";

        const resetBattleState = useCallback(
            (sentenceSet, playerHealth) => {
                setActiveSentences(sentenceSet.sentences);
                setActiveTranslations(sentenceSet.translations);
                setTranslationsMap(createTranslationsMap(sentenceSet.translations));
                setCurrentSentenceIdx(0);
                setTypedInput("");
                setTotalErrors(0);
                setTotalCorrectChars(0);
                setCombo(0);
                setEnemyHp(quest.enemyHP);
                setPlayerHp(playerHealth);
                setStartTime(null);
                setElapsedSec(0);
                setIsCompleted(false);
                setIsFailed(false);
                setLastCompletedSentenceToast(null);
            },
            [quest.enemyHP],
        );

        useEffect(() => {
            const sentenceSet = getQuestSentenceSet(
                quest,
                use108Pool,
                isRandomized || use108Pool,
            );
            resetBattleState(sentenceSet, stats.currentHp);

            if (sentenceSet.translations.length === 0) {
                sentenceSet.sentences.forEach(async (sentence, index) => {
                    try {
                        const res = await fetch("/api/translate-sentence", {
                            method : "POST",
                            headers: {"Content-Type": "application/json"},
                            body   : JSON.stringify({sentence}),
                        });
                        const data = await res.json();
                        if (data.success && data.translation) {
                            setTranslationsMap((prev) => ({
                                ...prev,
                                [index]: data.translation,
                            }));
                        }
                    } catch (e) {
                    }
                });
            }
        }, [quest, isRandomized, use108Pool, resetBattleState]);

        const handleReshuffleNow = () => {
            const sentenceSet = getQuestSentenceSet(quest, use108Pool, true);
            resetBattleState(sentenceSet, stats.currentHp);
        };

        useEffect(() => {
            let interval;
            if (startTime && !isCompleted && !isFailed) {
                interval = setInterval(() => {
                    setElapsedSec(Math.floor((Date.now() - startTime) / 1000));
                }, 1000);
            }
            return () => clearInterval(interval);
        }, [startTime, isCompleted, isFailed]);

        // Auto fade-out Success Toast Notification after 3 seconds
        useEffect(() => {
            if (lastCompletedSentenceToast) {
                const timer = setTimeout(() => {
                    setLastCompletedSentenceToast(null);
                }, 3000);
                return () => clearTimeout(timer);
            }
        }, [lastCompletedSentenceToast]);

        const currentWpm =
                  elapsedSec > 0
                      ? Math.round(totalCorrectChars / 5 / (elapsedSec / 60))
                      : 0;
        const totalTypedAttempts = totalCorrectChars + totalErrors;
        const currentAccuracy =
                  totalTypedAttempts > 0
                      ? Math.round((totalCorrectChars / totalTypedAttempts) * 100)
                      : 100;

        const handleInputChange = (e) => {
            if (isCompleted || isFailed) return;
            soundFX.initCtx();
            const val = e.target.value;
            if (!startTime) setStartTime(Date.now());

            if (val.length < typedInput.length) {
                setTypedInput(val);
                return;
            }

            const lastChar = val[val.length - 1];
            const expectedChar = currentSentence[val.length - 1];

            if (lastChar === expectedChar) {
                setTotalCorrectChars((prev) => prev + 1);
                setCombo((prev) => prev + 1);
                setTypedInput(val);

                // Check sentence completion
                if (val === currentSentence) {
                    soundFX.playSentenceSuccessSound();
                    const newHp = Math.max(0, enemyHp - 30);
                    setEnemyHp(newHp);

                    if (autoTTS) speakText(currentSentence);

                    const curTranslation =
                              translationsMap[currentSentenceIdx] ||
                              activeTranslations?.[currentSentenceIdx] ||
                              "";
                    const isLastSentence =
                              currentSentenceIdx + 1 >= activeSentences.length;

                    if (!isLastSentence) {
                        setLastCompletedSentenceToast({
                            id             : Date.now(),
                            isQuestComplete: false,
                            title          : isEn
                                ? "🎉 Sentence Cleared!"
                                : "🎉 พิมพ์ประโยคสำเร็จ!",
                            sub            : isEn
                                ? `+20 XP | Speed & Accuracy Bonus!`
                                : `+20 XP | 🇹🇭 ${curTranslation || "สะสมโบนัสความเร็ว"}`,
                            sentence       : currentSentence,
                        });

                        setTimeout(() => {
                            setCurrentSentenceIdx((prev) => prev + 1);
                            setTypedInput("");
                        }, 400);
                    } else {
                        handleVictory(totalCorrectChars + 1, totalErrors);
                    }
                } else if (lastChar === " ") {
                    soundFX.playWordSuccessSound();
                } else {
                    soundFX.playKeyClick(soundProfile);
                }
            } else {
                soundFX.playErrorSound();
                setTotalErrors((prev) => prev + 1);
                setCombo(0);
            }
        };

        const handleVictory = (
            finalCorrect = totalCorrectChars,
            finalErr     = totalErrors,
        ) => {
            setIsCompleted(true);
            soundFX.playVictorySound();
            const totalTime = elapsedSec > 0 ? elapsedSec : 1;
            const finalWpm = Math.round(finalCorrect / 5 / (totalTime / 60));
            const totalAttempts = finalCorrect + finalErr;
            const finalAcc =
                      totalAttempts > 0
                          ? Math.round((finalCorrect / totalAttempts) * 100)
                          : 100;

            setLastCompletedSentenceToast({
                id             : Date.now(),
                isQuestComplete: true,
                title          : isEn ? "🎉 Quest Cleared!" : "🎉 เคลียร์เควสสำเร็จ!",
                sub            : isEn
                    ? `+${quest.completionBonusGold} Gold | +${quest.completionBonusXP} XP | ⚡ ${finalWpm} WPM`
                    : `+${quest.completionBonusGold} Gold | +${quest.completionBonusXP} XP | ⚡ ${finalWpm} WPM`,
            });

            onQuestComplete({
                questId     : quest.id,
                questTitle  : quest.title,
                wpm         : finalWpm,
                accuracy    : finalAcc,
                totalChars  : finalCorrect,
                goldEarned  : quest.completionBonusGold,
                xpEarned    : quest.completionBonusXP,
                totalTimeSec: totalTime,
                timestamp   : new Date().toLocaleTimeString([], {
                    hour  : "2-digit",
                    minute: "2-digit",
                }),
            });
        };

        return (
            <div className="space-y-5">
                {/* Battle Arena Header: Single Ad Space #1 Banner */}
                <div className="bg-slate-50/90 border-2 border-dashed border-slate-300 rounded-2xl p-3.5 flex flex-col items-center justify-center text-center shadow-2xs min-h-[72px] relative overflow-hidden group hover:border-blue-400 transition w-full">
                    <div className="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        [{" "}
                        {isEn
                            ? "Ad Space #1 - Adsterra Banner 320x50"
                            : "พื้นที่โฆษณาที่ 1 - Adsterra Banner 320x50"}{" "}
                        ]
                    </div>
                    <span className="text-[10px] text-slate-400 mt-0.5 font-mono">
                {isEn
                    ? "(Supported placeholder for Adsterra 320x50 / 468x60 ad banner code)"
                    : "(พื้นที่รองรับโค้ดโฆษณา Adsterra 320x50 / 468x60)"}
              </span>
                </div>

                {/* Translation & Audio Toolbar */}
                <div className="bg-white border border-slate-200/80 rounded-2xl p-4 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div className="flex items-start gap-3">
                        <div className="p-2.5 rounded-xl bg-blue-50 border border-blue-100 text-blue-600 shrink-0 mt-0.5">
                            <Icon name="languages" className="w-5 h-5"/>
                        </div>
                        <div>
                            <div className="flex items-center gap-2 flex-wrap">
                    <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                      {isEn
                          ? `Typing Speed Mode (English) - Sentence ${currentSentenceIdx + 1}/${activeSentences.length}`
                          : `คำแปลภาษาไทย (ประโยคที่ ${currentSentenceIdx + 1}/${activeSentences.length})`}
                    </span>
                                <span
                                    className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${
                                        isEn
                                            ? "bg-blue-50 border-blue-200 text-blue-700"
                                            : "bg-emerald-50 border-emerald-200 text-emerald-700"
                                    }`}
                                >
                      {isEn ? "ENGLISH FOCUS" : "THAI TRANSLATION"}
                    </span>
                                {use108Pool ? (
                                    <span className="text-[10px] px-2 py-0.5 rounded-full font-extrabold bg-amber-100 border border-amber-300 text-amber-800 animate-pulse">
                        🌐 {isEn ? "108 SENTENCES POOL" : "คลังรวม 108 ประโยค"}
                      </span>
                                ) : (
                                    isRandomized && (
                                        <span className="text-[10px] px-2 py-0.5 rounded-full font-extrabold bg-purple-50 border border-purple-200 text-purple-700 animate-pulse">
                          🔀 {isEn ? "RANDOM ORDER" : "สุ่มลำดับ"}
                        </span>
                                    )
                                )}
                            </div>
                            <p className="text-sm font-semibold text-slate-800 leading-snug mt-0.5">
                                {isEn
                                    ? "Focus on English letter sequence & typing velocity. Thai translation hidden in EN mode."
                                    : translationsMap[currentSentenceIdx] ||
                                    activeTranslations?.[currentSentenceIdx] ||
                                    "กำลังโหลดคำแปลภาษาไทย..."}
                            </p>
                        </div>
                    </div>

                    <div className="flex items-center gap-2 w-full sm:w-auto shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100 flex-wrap">
                        <button
                            type="button"
                            onClick={() => speakText(currentSentence)}
                            className="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow-xs transition cursor-pointer"
                        >
                            <Icon name="volume" className="w-4 h-4"/>
                            <span>{isEn ? "Listen Audio" : "ฟังเสียงอ่าน"}</span>
                        </button>

                        <button
                            type="button"
                            onClick={() => setAutoTTS(!autoTTS)}
                            className={`flex items-center gap-1.5 px-3 py-2 rounded-xl border text-xs font-semibold transition cursor-pointer ${
                                autoTTS
                                    ? "bg-indigo-50 border-indigo-200 text-indigo-700 hover:bg-indigo-100"
                                    : "bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100"
                            }`}
                        >
                            <Icon
                                name={autoTTS ? "volume" : "volume-x"}
                                className="w-3.5 h-3.5"
                            />
                            <span>{autoTTS ? "Auto TTS: ON" : "Auto TTS: OFF"}</span>
                        </button>

                        <button
                            type="button"
                            onClick={() => {
                                const nextVal = !sfxEnabled;
                                setSfxEnabled(nextVal);
                                soundFX.enabled = nextVal;
                            }}
                            className={`flex items-center gap-1.5 px-3 py-2 rounded-xl border text-xs font-semibold transition cursor-pointer ${
                                sfxEnabled
                                    ? "bg-emerald-50 border-emerald-200 text-emerald-700 hover:bg-emerald-100"
                                    : "bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100"
                            }`}
                            title={
                                isEn
                                    ? "Toggle sound effects"
                                    : "เปิด/ปิด เสียงแจ้งเตือนการพิมพ์"
                            }
                        >
                            <Icon
                                name={sfxEnabled ? "zap" : "volume-x"}
                                className="w-3.5 h-3.5"
                            />
                            <span>
                    {sfxEnabled
                        ? isEn
                            ? "SFX: ON"
                            : "เสียงแจ้งเตือน: เปิด"
                        : isEn
                            ? "SFX: OFF"
                            : "เสียงแจ้งเตือน: ปิด"}
                  </span>
                        </button>

                        {sfxEnabled && (
                            <button
                                type="button"
                                onClick={() => {
                                    const profiles = [
                                        "mechanical",
                                        "bubble",
                                        "typewriter",
                                        "digital",
                                    ];

        const handleSend = async (customPrompt) => {
            const msgToSend = customPrompt || inputMsg;
            if (!msgToSend.trim()) return;

            let currentPersona = activePersona;
            const lower = msgToSend.toLowerCase();
            if (lower.includes("ทักแฟนสาว") || lower.includes("girlfriend")) {
                currentPersona = "girlfriend";
                setActivePersona("girlfriend");
            } else if (lower.includes("ทักเพื่อน") || lower.includes("bestie")) {
                currentPersona = "bestie";
                setActivePersona("bestie");
            }

            const newMsgs = [...messages, {sender: "user", text: msgToSend}];
            setMessages(newMsgs);
            if (!customPrompt) setInputMsg("");
            setLoading(true);

            try {
                const res = await fetch("/api/gm/chat", {
                    method : "POST",
                    headers: {"Content-Type": "application/json"},
                    body   : JSON.stringify({
                        message : msgToSend,
                        messages: newMsgs,
                        persona : currentPersona,
                        lang    : lang || "th",
                    }),
                });
                const data = await res.json();
                if (data.reply) {
                    setMessages((prev) => [
                        ...prev,
                        {sender: "bot", persona: currentPersona, text: data.reply},
                    ]);
                } else {
                    const mockReply = getPersonaMockReply(currentPersona, msgToSend);
                    setMessages((prev) => [
                        ...prev,
                        {sender: "bot", persona: currentPersona, text: mockReply},
                    ]);
                }
            } catch (e) {
                const mockReply = getPersonaMockReply(currentPersona, msgToSend);
                setMessages((prev) => [
                    ...prev,
                    {sender: "bot", persona: currentPersona, text: mockReply},
                ]);
            } finally {
                setLoading(false);
            }
        };

            setLoading(true);

                            <input
                                type="text"

    // --- Virtual Keyboard ---
    function VirtualKeyboard({activeKey, onKeyPress}) {
        const rows = [
            ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p"],
            ["a", "s", "d", "f", "g", "h", "j", "k", "l"],
            ["z", "x", "c", "v", "b", "n", "m"],
            ["Space"],
        ];
        const normalizedTarget =
                  activeKey === " "
                      ? "Space"
                      : activeKey
                          ? activeKey.toLowerCase()
                          : "";

        return (
            <div className="bg-slate-100 border border-slate-200/80 rounded-2xl p-3 sm:p-4 shadow-xs max-w-2xl mx-auto my-2">
                <div className="text-[11px] font-medium text-slate-500 mb-2 flex justify-between items-center px-1">
              <span>
                ⌨️ แป้นพิมพ์เสมือน (Touch Typing Guide & Clickable Keys)
              </span>
                    {normalizedTarget && (
                        <span className="text-blue-600 font-bold">
                  กดปุ่ม:{" "}
                            <span className="bg-blue-50 px-2 py-0.5 border border-blue-200 rounded uppercase font-mono">
                    {normalizedTarget}
                  </span>
                </span>
                    )}
                </div>
                <div className="flex flex-col gap-1.5 items-center">
                    {rows.map((row, rIdx) => (
                        <div
                            key={rIdx}
                            className="flex gap-1 sm:gap-1.5 justify-center"
                        >
                            {row.map((k) => {
                                const isSpace = k === "Space";
                                const isTarget = isSpace
                                    ? normalizedTarget === "space"
                                    : normalizedTarget === k;
                                return (
                                    <button
                                        key={k}
                                        type="button"
                                        onClick={() => onKeyPress(isSpace ? " " : k)}
                                        className={`font-mono text-xs font-bold rounded-lg transition duration-150 flex items-center justify-center select-none cursor-pointer ${
                                            isSpace
                                                ? "w-48 sm:w-64 h-9"
                                                : "w-7 sm:w-10 h-8 sm:h-9"
                                        } ${
                                            isTarget
                                                ? "bg-blue-600 text-white shadow-md scale-110 ring-2 ring-blue-400 animate-pulse font-extrabold"
                                                : "bg-white hover:bg-slate-50 active:bg-blue-50 border border-slate-200 text-slate-800 shadow-xs"
                                        }`}
                                    >
                                        {k.toUpperCase()}
                                    </button>
                                );
                            })}
                        </div>
                    ))}
                </div>
            </div>
        );
    }
