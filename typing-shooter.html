<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="닭과 물고기의 단어를 입력해 처치하는 무료 타자 슈팅 게임">
    <title>타자 슈팅</title>
    <style>
        :root {
            --bg: #f5f7fb;
            --panel: #ffffff;
            --line: #dfe5ee;
            --line-strong: #cbd5e1;
            --text: #172033;
            --muted: #667085;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --success: #16a34a;
            --danger: #dc2626;
            --shadow: 0 18px 55px rgba(15, 23, 42, .08);
            --radius: 22px;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            min-width: 320px;
            color: var(--text);
            background:
                    radial-gradient(circle at top left, rgba(37, 99, 235, .07), transparent 34%),
                    var(--bg);
            font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
            line-height: 1.5;
        }

        button, input, select { font: inherit; }

        button, select { cursor: pointer; }

        .page {
            width: min(100% - 32px, 920px);
            margin: 0 auto;
            padding: 48px 0 64px;
        }

        .hero { margin-bottom: 24px; }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 10px;
            padding: 7px 11px;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            color: #1d4ed8;
            background: #eff6ff;
            font-size: 13px;
            font-weight: 800;
        }

        .title {
            margin: 0;
            font-size: clamp(30px, 5vw, 46px);
            line-height: 1.15;
            letter-spacing: -.04em;
        }

        .lead {
            max-width: 680px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: clamp(15px, 2.5vw, 18px);
        }

        .game-card {
            padding: 24px;
            border: 1px solid rgba(203, 213, 225, .9);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, .94);
            box-shadow: var(--shadow);
        }

        .lb-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 16px;
        }

        .ctl-label { font-weight: 800; }

        .lang select {
            min-width: 170px;
            height: 44px;
            padding: 0 40px 0 14px;
            border: 1px solid var(--line-strong);
            border-radius: 12px;
            color: var(--text);
            background: #fff;
            outline: none;
        }

        .lang select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
        }

        .stage {
            position: relative;
            width: 100%;
            height: 470px;
            min-height: 360px;
            overflow: hidden;
            border: 1px solid #cfe0f5;
            border-radius: 18px;
            background:
                    linear-gradient(to bottom, rgba(255,255,255,.7), rgba(239,246,255,.85)),
                    repeating-linear-gradient(0deg, transparent 0 39px, rgba(37,99,235,.035) 40px),
                    repeating-linear-gradient(90deg, transparent 0 39px, rgba(37,99,235,.035) 40px);
            user-select: none;
            touch-action: manipulation;
            transition: border-color .2s, box-shadow .2s, transform .12s;
        }

        .stage:hover {
            border-color: #93c5fd;
            box-shadow: inset 0 0 0 1px rgba(37,99,235,.05);
        }

        .stage.hit {
            border-color: #fca5a5;
            box-shadow: inset 0 0 0 3px rgba(220,38,38,.15);
            transform: translateX(2px);
        }

        .stage-inner {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-content: center;
            justify-items: center;
            padding: 28px;
            text-align: center;
        }

        .stage-icon {
            display: grid;
            place-items: center;
            width: 82px;
            height: 82px;
            margin-bottom: 18px;
            border: 1px solid #bfdbfe;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 14px 32px rgba(37,99,235,.13);
            font-size: 42px;
        }

        .stage-title {
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 900;
            letter-spacing: -.03em;
        }

        .stage-sub {
            max-width: 520px;
            margin-top: 8px;
            color: var(--muted);
            font-size: 15px;
        }

        .hud {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .hud span {
            min-width: 88px;
            padding: 8px 12px;
            border: 1px solid rgba(203,213,225,.9);
            border-radius: 999px;
            background: rgba(255,255,255,.9);
            box-shadow: 0 8px 20px rgba(15,23,42,.08);
            font-weight: 900;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        #hudLives { color: var(--danger); }

        .entity {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            width: max-content;
            will-change: transform;
            pointer-events: none;
        }

        .ent-sprite {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            border: 1px solid rgba(203,213,225,.95);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 18px rgba(15,23,42,.1);
            font-size: 29px;
        }

        .fish .ent-sprite { background: #eff6ff; }
        .chicken .ent-sprite { background: #fff7ed; }

        .ent-word {
            padding: 7px 10px;
            border: 1px solid rgba(203,213,225,.95);
            border-radius: 10px;
            color: #111827;
            background: rgba(255,255,255,.95);
            box-shadow: 0 6px 16px rgba(15,23,42,.08);
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
        }

        .wd-done { color: var(--primary); }

        .type-wrap { display: none; margin-top: 14px; }

        .type-box {
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            padding: 10px 14px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            color: var(--primary);
            background: var(--primary-soft);
            font-size: 21px;
            font-weight: 900;
            letter-spacing: .02em;
            word-break: break-all;
        }

        .type-box:empty::before {
            content: "화면의 단어를 입력하세요";
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }

        .type-box.miss {
            border-color: #fecaca;
            color: var(--danger);
            background: #fff1f2;
        }

        #typeInput {
            width: 100%;
            height: 58px;
            padding: 0 18px;
            border: 2px solid #cbd5e1;
            border-radius: 14px;
            color: var(--text);
            background: #fff;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            outline: none;
        }

        #typeInput:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 5px rgba(37,99,235,.12);
        }

        .summary {
            display: none;
            margin-top: 18px;
            padding: 26px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
            text-align: center;
        }

        .summary.show { display: block; }

        .summary h2 { margin: 0 0 8px; font-size: 23px; }

        .summary-score {
            margin: 6px 0;
            color: var(--primary);
            font-size: clamp(42px, 8vw, 64px);
            font-weight: 950;
            letter-spacing: -.04em;
        }

        .summary-rating { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
        .summary-meta { margin: 0; color: var(--muted); }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            min-width: 130px;
            height: 46px;
            padding: 0 18px;
            border: 1px solid var(--line-strong);
            border-radius: 12px;
            color: var(--text);
            background: #fff;
            font-weight: 850;
        }

        .btn-primary { border-color: var(--primary); color: #fff; background: var(--primary); }
        .btn:hover { transform: translateY(-1px); }

        .help {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 18px;
        }

        .help-item {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 15px;
            background: #fff;
        }

        .help-item strong { display: block; margin-bottom: 4px; }
        .help-item span { color: var(--muted); font-size: 14px; }

        @media (max-width: 640px) {
            .page { width: min(100% - 20px, 920px); padding: 24px 0 40px; }
            .game-card { padding: 14px; border-radius: 18px; }
            .lb-controls { align-items: stretch; flex-direction: column; }
            .lang select { width: 100%; }
            .stage { height: 410px; min-height: 320px; }
            .entity { gap: 5px; }
            .ent-sprite { width: 42px; height: 42px; font-size: 24px; }
            .ent-word { padding: 6px 8px; font-size: 14px; }
            .help { grid-template-columns: 1fr; }
            .actions { flex-direction: column; }
            .btn { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
        }
    </style>
</head>
<body>
<main class="page">
    <header class="hero">
        <p class="eyebrow">⌨️ 무료 타자게임</p>
        <h1 class="title" data-i18n="test_typing">타자 슈팅</h1>
        <p class="lead" data-i18n="test_typing_desc">닭과 물고기의 단어를 입력해 처치하는 무료 타이핑 연습 게임!</p>
    </header>

    <section class="game-card" aria-label="타자 슈팅 게임">
        <div class="lb-controls">
            <span class="ctl-label" data-i18n="typing_lang">타자 언어</span>
            <div class="lang">
                <select id="typeLang" aria-label="타자 언어 선택"></select>
            </div>
        </div>

        <div id="stage" class="stage game" role="button" tabindex="0" aria-label="타자 게임 시작" style="margin-top:18px">
            <div id="hud" class="hud"><span id="hudScore"></span><span id="hudLives"></span></div>
            <div class="stage-inner" id="introInner">
                <div id="stageIcon" class="stage-icon"></div>
                <div id="stageTitle" class="stage-title"></div>
                <div id="stageSub" class="stage-sub"></div>
            </div>
        </div>

        <div class="type-wrap" id="typeWrap">
            <div id="typeShow" class="type-box" aria-live="polite"></div>
            <input id="typeInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="단어 입력">
        </div>

        <section id="summary" class="summary" aria-live="polite">
            <h2 id="sumTitle">게임 결과</h2>
            <div id="sumAvg" class="summary-score"></div>
            <p id="sumRating" class="summary-rating"></p>
            <p id="sumMeta" class="summary-meta"></p>
            <div class="actions">
                <button id="btnRetry" class="btn btn-primary" type="button">다시 시작</button>
                <button id="btnShare" class="btn" type="button">결과 공유</button>
            </div>
        </section>
    </section>

    <section class="help" aria-label="게임 방법">
        <div class="help-item"><strong>1. 게임 시작</strong><span>게임 화면을 클릭하거나 선택한 뒤 Enter 키를 누르세요.</span></div>
        <div class="help-item"><strong>2. 단어 입력</strong><span>닭과 물고기 옆에 표시되는 단어를 정확히 입력하세요.</span></div>
        <div class="help-item"><strong>3. 생명 지키기</strong><span>적이 화면 끝에 닿으면 생명이 줄어듭니다. 생명은 3개입니다.</span></div>
    </section>
</main>

<script>

            { c: 'ru', n: 'Русский' },
            { c: 'id', n: 'Bahasa Indonesia' },
            { c: 'it', n: 'Italiano' }

    (function () {
        'use strict';

        var messages = {
            click_to_start: '화면을 클릭해 시작하세요',
            typing_howto: '닭과 물고기 옆의 단어를 정확히 입력하면 처치할 수 있습니다.',
            typing_words: '개 처치',
            typing_cpm: '타/분',
            typing_summary: '게임 결과',
            rating_elite: '전설의 타자',
            rating_pro: '프로 타자',

            rating_casual: '가볍게 즐기는 중',
            rating_sleepy: '조금 더 연습해 볼까요?'
        };

        window.ggT = function (key) { return messages[key] || key; };

        window.ggIcon = function (name) {
            var span = document.createElement('span');
            span.setAttribute('aria-hidden', 'true');
            span.textContent = name === 'chicken' ? '🐔' : name === 'fish' ? '🐟' : '⌨️';
            return span;
        };

        window.ggSetIcon = function (el, name) {
            if (!el) return;
            while (el.firstChild) el.removeChild(el.firstChild);
            el.appendChild(window.ggIcon(name));
        };

        window.ggSummaryMascot = function () {};
        window.ggReport = function () {};

        var stage = document.getElementById('stage');
        stage.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                stage.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
            }
        });
    })();

            // EXACT greedy match on EVERY event (composition included): a correctly-toned word clears the
            // instant it appears in the input → no Enter. (If the IME applies tones only at commit, the match
            // simply lands at compositionend.) Tones MUST match — base-only matching would defeat the point of
            // Vietnamese typing practice.
            var go = true, hitLatin = false;
            while (go && buf) {
                go = false;
                var done = aliveList().filter(function (x) { return buf.indexOf(x.word) === 0; });
                if (done.length) {
                    done.sort(function (a, b) { return (b.word.length - a.word.length) || (urg(b, A) - urg(a, A)); });
                    destroy(done[0]); if (!/[가-힣]/.test(done[0].word)) hitLatin = true; consumed += done[0].word.length; buf = v.slice(consumed); go = true;
                } else {
                    // telex-prefix extraction: the macOS IME mashes words it never committed ("bạnbofras").
                    // Pull off the SHORTEST prefix whose telex resolves to an alive enemy ("bof"->"bò"), one
                    // word at a time. EXACT (tones from the keys the user typed) — practice stays intact.
                    for (var kk = 2; kk <= buf.length; kk++) {
                        var pre = buf.slice(0, kk), tw = telex(pre);
                        if (tw !== pre) { var td = aliveList().filter(function (x) { return x.word === tw; }); if (td.length) { destroy(td[0]); hitLatin = true; consumed += kk; buf = v.slice(consumed); go = true; break; } }
                    }
                }
            }
            // committed leftover that is not a prefix of any alive enemy = typo/wrong word → clear it so it
            // can't stick at the front and block later words. Only on COMMIT (writing value mid-composition
            // would disturb the IME / drop in-progress tone keys).
            if (committed && buf && !aliveList().some(function (x) { return x.word.indexOf(buf) === 0; })) {
                typeInput.value = ''; consumed = 0; buf = '';
            }
            if (composing && hitLatin && !buf) resetComp();
            showBuf(buf, highlight(buf));
            log('proc', 'buf=' + buf + ' consumed=' + consumed + ' committed=' + !!committed);
        }
        // drop the already-consumed prefix from the visible input — safe only when NOT composing
        function compact() { if (consumed) { var v = typeInput.value; if (v && v.normalize) v = v.normalize('NFC'); typeInput.value = v.slice(consumed); consumed = 0; } }
        function onInput(ev) {
            if (state !== 'playing') return;
            if (ev && ev.isComposing === false) composing = false; // self-heal a stuck composing flag (commit input)
            log('input', 'isComposing=' + (ev && ev.isComposing), 'type=' + (ev && ev.inputType), 'val=' + JSON.stringify(typeInput.value));
            if (!typeStartT && typeInput.value) typeStartT = performance.now();
            var comp = composing || (ev && ev.isComposing);
            processBuffer(!comp);   // committed → greedy; mid-composition → exact-only
            if (!comp) compact();
        }

        // ---- loop ----
        function loop(t) {
            if (state !== 'playing') return;
            if (!lastT) lastT = t;
            var dt = (t - lastT) / 1000; if (dt > 0.1) dt = 0.1; lastT = t; elapsed += dt * 1000;
            spawnAcc += dt;
            var every = Math.max(1.9, 2.8 - (elapsed / 60000) * 0.10 - killed * 0.002);
            if (spawnAcc >= every && aliveList().length < 6) { spawnAcc = 0; spawn(); }
            var A = area();
            for (var i = 0; i < entities.length; i++) {
                var e = entities[i]; if (!e.alive) continue;
                if (e.type === 'chicken') { e.y += e.speed * dt; e.el.style.transform = 'translate(' + e.x + 'px,' + e.y + 'px)'; if (e.y >= A.h - 36) loseLife(e); }
                else { e.x += e.speed * dt; e.el.style.transform = 'translate(' + e.x + 'px,' + e.y + 'px)'; if (e.x >= A.w - 52) loseLife(e); }
            }
            if (state === 'playing') raf = requestAnimationFrame(loop);
        }

        function ratingKey(s) {
            if (s >= 1200) return 'rating_elite'; if (s >= 800) return 'rating_pro'; if (s >= 500) return 'rating_sharp';
            if (s >= 280) return 'rating_average'; if (s >= 120) return 'rating_casual'; return 'rating_sleepy';
        }
        function removeAll() { entities.forEach(function (e) { if (e.el.parentNode) e.el.parentNode.removeChild(e.el); }); entities = []; }

        function start() {
            state = 'playing'; score = 0; lives = LIVES0; killed = 0; chars = 0; typeStartT = 0; consumed = 0; elapsed = 0; spawnAcc = 0; lastT = 0;
            removeAll();
            introInner.style.display = 'none'; hud.style.display = 'flex';
            typeWrap.style.display = 'block'; typeInput.value = ''; typeInput.disabled = false; showBuf('', false);
            measure(); updHud(); spawn();
            var f = function () { try { typeInput.focus(); } catch (e) {} }; f(); setTimeout(f, 0);
            raf = requestAnimationFrame(loop);
        }
        function metaText() { return killed + ' ' + T('typing_words') + ' · ' + lastCpm + ' ' + T('typing_cpm') + ' · ' + lastWpm + ' WPM'; }
        function finish() {
            if (state !== 'playing') return;
            state = 'done'; if (raf) cancelAnimationFrame(raf);
            removeAll(); stage.style.display = 'none';
            var rk = ratingKey(score);
            sumTitle.textContent = T('typing_summary');
            clear(sumAvg); var n = document.createElement('span'); n.className = 'pixel-num'; n.textContent = String(score); sumAvg.appendChild(n);
            var mins = typeStartT ? Math.max(1 / 600, (performance.now() - typeStartT) / 60000) : 0;
            lastCpm = mins ? Math.round(chars / mins) : 0;
            lastWpm = mins ? Math.round((chars / 5) / mins) : 0;
            sumRating.textContent = T(rk); sumMeta.textContent = metaText();
            if (window.ggSummaryMascot) window.ggSummaryMascot(rk);
            if (window.ggReport) window.ggReport({ game: 'typing', score: score, unit: '', betterIsLower: false, ratingKey: rk });
            summary.classList.add('show');
        }
        function render() {
            window.ggSetIcon(elIcon, 'keyboard');
            elTitle.textContent = T('click_to_start'); elSub.textContent = T('typing_howto');
            introInner.style.display = ''; hud.style.display = 'none'; typeWrap.style.display = 'none';
        }
        function reset() {
            if (raf) cancelAnimationFrame(raf); state = 'idle'; removeAll();
            summary.classList.remove('show'); stage.style.display = ''; render();
        }

        stage.addEventListener('pointerdown', function (e) {
            if (state === 'idle') { e.preventDefault(); start(); }
            else if (state === 'playing') { try { typeInput.focus(); } catch (e2) {} } // safety net: refocus input
        });
        typeInput.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
        typeInput.addEventListener('focus', function () { setTimeout(fitViewport, 300); setTimeout(fitViewport, 650); }); // keyboard opens async
        typeInput.addEventListener('blur', function () { setTimeout(fitViewport, 150); });
        typeInput.addEventListener('compositionstart', function () { composing = true; compStart = nfc(typeInput.value); compData = ''; log('compositionstart', 'start=' + JSON.stringify(compStart)); });
        typeInput.addEventListener('compositionupdate', function (e) { compData = (e && e.data) || ''; log('compositionupdate', 'data=' + JSON.stringify(compData)); processBuffer(false); });
        typeInput.addEventListener('compositionend', function (e) {
            log('compositionend', 'data=' + JSON.stringify(e && e.data), 'val=' + JSON.stringify(typeInput.value));
            composing = false; compData = ''; processBuffer(true); compact();
            // NOTE: no deferred setTimeout re-match — it could fire mid-next-composition and the
            // junk-clear would wipe the in-progress syllable (the Korean "공부" wipe bug). The trailing
            // non-composing input event (Edge/FF) already re-runs committed matching.
        });
        typeInput.addEventListener('input', onInput);
        // Enter / Esc → reset what you've typed (bail out of a wrong word)
        typeInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === 'Escape') {
                e.preventDefault();
                typeInput.value = ''; consumed = 0; composing = false;
                resetHighlights(); showBuf('', false);
            }
        });
        if (typeLangSel) {
            typeLangSel.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
            typeLangSel.addEventListener('change', function () { try { localStorage.setItem('gg_type_lang', typeLangSel.value); } catch (e) {} });
        }
        btnRetry.addEventListener('click', reset);
        btnShare.addEventListener('click', function () {
            var text = '타자 슈팅에서 ' + score + '점을 기록했습니다! ⚡ 기록에 도전해 보세요.';
            if (navigator.share) navigator.share({ title: '타자 슈팅', text: text, url: location.href }).catch(function () {});
            else if (navigator.clipboard) { navigator.clipboard.writeText(text + ' ' + location.href); alert(text); } else alert(text);
        });
        window.addEventListener('gg:lang', function () {
            if (state === 'done') { sumTitle.textContent = T('typing_summary'); sumRating.textContent = T(ratingKey(score)); sumMeta.textContent = metaText(); }
            else if (state === 'idle') render();
        });

        // test seam — DEBUG-only (?debug=1) so it can't be used to clear enemies / farm score in production
        if (DEBUG) window.__ggTyping = {
            lose: function () { var e = aliveList()[0]; if (e) { e.alive = false; if (e.el.parentNode) e.el.parentNode.removeChild(e.el); } lives--; updHud(); if (lives <= 0) finish(); },
            info: function () { return { state: state, score: score, lives: lives, alive: aliveList().length, killed: killed, chars: chars, cpm: lastCpm, wpm: lastWpm }; },
            spawnWord: function (w, t) { spawn(w, t); },
            clearEntities: function () { removeAll(); },
            words: function () { return aliveList().map(function (e) { return e.word; }); }
        };

        window.addEventListener('resize', measure);
        document.addEventListener('DOMContentLoaded', function () { populateLangSelect(); render(); measure(); });
    })();

</script>
