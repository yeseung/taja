<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typing Practice - 다양한 언어 타자연습</title>

    <meta
            name="description"
            content="설치 없이 이용할 수 있는 무료 웹 타자연습입니다. 다양한 언어로 타자 속도와 정확도를 연습해 보세요."
    >
    <meta
            name="keywords"
            content="타자연습, 타자게임, 영문타자, 한글타자, typing practice, typing test"
    >

    <meta property="og:title" content="Typing Practice - 타자연습">
    <meta
            property="og:description"
            content="다양한 언어를 지원하는 무료 웹 타자연습"
    >
    <meta property="og:type" content="website">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
            rel="stylesheet"
    >

    <style>
        :root {
            --background: #f7f8fa;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --text: #111827;
            --text-soft: #64748b;
            --border: #e5e7eb;
            --border-dark: #cbd5e1;
            --primary: #111827;
            --success: #16a34a;
            --danger: #dc2626;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: "Noto Sans KR", sans-serif;
            letter-spacing: -0.04em;
        }

        button,
        input,
        select {
            font: inherit;
        }

        button,
        select,
        input[type="checkbox"],
        input[type="range"] {
            cursor: pointer;
        }

        .page {
            width: min(100% - 32px, 1000px);
            margin: 0 auto;
            padding: 48px 0 80px;
        }

        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
            padding: 7px 13px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 44px);
            font-weight: 800;
            letter-spacing: -0.06em;
        }

        .header p {
            margin: 10px 0 0;
            color: var(--text-soft);
            font-size: 15px;
        }

        .card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
        }

        .control-label {
            color: var(--text-soft);
            font-size: 14px;
            font-weight: 700;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #text-size-slider {
            width: 130px;
            accent-color: var(--primary);
        }

        #text-size-display {
            min-width: 42px;
            font-size: 14px;
            font-weight: 700;
        }

        .timer {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border-radius: 12px;
            background: var(--surface-soft);
            font-size: 14px;
            font-weight: 700;
        }

        #countdown-time {
            min-width: 38px;
            font-variant-numeric: tabular-nums;
        }

        .checkbox-control {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--text-soft);
            font-size: 14px;
            font-weight: 700;
            user-select: none;
        }

        .checkbox-control input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: var(--primary);
        }

        select {
            min-width: 150px;
            height: 40px;
            padding: 0 36px 0 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        select:focus {
            border-color: var(--primary);
        }

        .mode-tabs {
            display: flex;
            gap: 6px;
            padding: 5px;
            border-radius: 12px;
            background: var(--surface-soft);
        }

        .mode-button {
            border: 0;
            border-radius: 9px;
            padding: 7px 12px;
            background: transparent;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
        }

        .mode-button.active {
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 1px 5px rgba(15, 23, 42, 0.08);
        }

        .option-list {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .option-button {
            min-width: 42px;
            border: 1px solid transparent;
            border-radius: 9px;
            padding: 6px 9px;
            background: transparent;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 700;
        }

        .option-button:hover {
            background: var(--surface-soft);
            color: var(--text);
        }

        .option-button.active {
            border-color: var(--border);
            background: var(--surface-soft);
            color: var(--text);
        }

        .stats {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .stat {
            white-space: nowrap;
            font-size: 14px;
        }

        .stat-label {
            color: var(--text-soft);
            font-weight: 500;
        }

        .stat-value {
            margin-left: 4px;
            font-weight: 800;
        }

        .typing-area {
            padding: 28px;
        }

        #text-display {
            min-height: 190px;
            max-height: 310px;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface-soft);
            color: #94a3b8;
            font-size: 20px;
            line-height: 1.65;
            letter-spacing: 0;
            word-break: break-word;
            scroll-behavior: smooth;
        }

        #text-display span {
            border-radius: 4px;
        }

        #text-display .current {
            background: #e2e8f0;
            color: var(--text);
        }

        #text-display .correct {
            color: var(--success);
        }

        #text-display .incorrect {
            color: var(--danger);
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 3px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        #input-field {
            width: 100%;
            height: 54px;
            padding: 0 17px;
            border: 1px solid var(--border-dark);
            border-radius: 14px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 18px;
            letter-spacing: 0;
            transition:
                    border-color 0.15s ease,
                    box-shadow 0.15s ease;
        }

        #input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.07);
        }

        #input-field:disabled {
            cursor: not-allowed;
            background: #f1f5f9;
        }

        #redo-button {
            flex: 0 0 auto;
            min-width: 110px;
            height: 54px;
            border: 0;
            border-radius: 14px;
            padding: 0 18px;
            background: var(--primary);
            color: #ffffff;
            font-weight: 800;
        }

        #redo-button:hover {
            opacity: 0.9;
        }

        .result {
            display: none;
            margin-top: 18px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface-soft);
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .result-title {
            margin: 0 0 14px;
            font-size: 20px;
            font-weight: 800;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .result-item {
            padding: 15px 10px;
            border-radius: 14px;
            background: var(--surface);
        }

        .result-number {
            display: block;
            font-size: 22px;
            font-weight: 800;
        }

        .result-label {
            display: block;
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 12px;
        }

        .help {
            margin-top: 18px;
            color: var(--text-soft);
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 720px) {
            .page {
                width: min(100% - 20px, 1000px);
                padding-top: 24px;
            }

            .toolbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 16px;
            }

            .toolbar-group {
                width: 100%;
            }

            .toolbar-group.space-between {
                justify-content: space-between;
            }

            .typing-area {
                padding: 16px;
            }

            #text-display {
                min-height: 220px;
                padding: 18px;
            }

            .input-row {
                flex-direction: column;
            }

            #redo-button {
                width: 100%;
            }

            .stats {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 30px;
            }

            .size-control {
                width: 100%;
            }

            #text-size-slider {
                flex: 1;
            }

            select {
                width: 100%;
            }

            .language-control {
                width: 100%;
            }

            .language-control select {
                margin-top: 7px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main class="page">
    <header class="header">
        <div class="header-badge">⌨️ Typing Practice</div>
        <h1>타자연습</h1>
        <p>원하는 언어와 연습 방식을 선택하고 바로 입력해 보세요.</p>
    </header>

    <section class="card">
        <div class="toolbar">
            <div class="toolbar-group">
                <div class="size-control">
                    <label class="control-label" for="text-size-slider">
                        글자 크기
                    </label>

                    <input
                            type="range"
                            id="text-size-slider"
                            min="12"
                            max="48"
                            value="20"
                    >

                    <span id="text-size-display">20px</span>
                </div>
            </div>

            <div class="timer">
                ⏱️
                <span>Time</span>
                <span id="countdown-time">1:00</span>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-group">
                <label class="checkbox-control" for="punctuation-checkbox">
                    <input id="punctuation-checkbox" type="checkbox">
                    문장부호 / Punctuation
                </label>

                <label class="checkbox-control" for="random-numbers-checkbox">
                    <input id="random-numbers-checkbox" type="checkbox">
                    숫자 / Numbers
                </label>
            </div>

            <div class="language-control">
                <label class="control-label" for="language-select">
                    언어 / Language
                </label>

                <select id="language-select">
                    <option value="english1000" selected>English</option>
                    <option value="numbers">Numbers</option>
                    <option value="symbols">Symbols</option>
                    <option value="german">German</option>
                    <option value="chinese">Chinese</option>
                    <option value="spanish">Spanish</option>
                    <option value="korean">Korean</option>
                    <option value="polish">Polish</option>
                    <option value="punjabi">Punjabi</option>
                    <option value="swedish">Swedish</option>
                    <option value="french">French</option>
                    <option value="arabic">Arabic</option>
                    <option value="portuguese">Portuguese</option>
                    <option value="russian">Russian</option>
                    <option value="finnish">Finnish</option>
                    <option value="italian">Italian</option>
                    <option value="malaysian">Malaysian</option>
                    <option value="dutch">Dutch</option>
                    <option value="filipino">Filipino</option>
                    <option value="japanese">Japanese</option>
                    <option value="vietnamese">Vietnamese</option>
                </select>
            </div>
        </div>

        <div class="toolbar">
            <div class="toolbar-group">
                <div class="mode-tabs">
                    <button
                            type="button"
                            class="mode-button active"
                            data-mode="words"
                    >
                        Words
                    </button>

                    <button
                            type="button"
                            class="mode-button"
                            data-mode="time"
                    >
                        Time
                    </button>
                </div>

                <div id="word-count" class="option-list">
                    <button type="button" class="option-button" data-words="10">
                        10
                    </button>

                    <button type="button" class="option-button" data-words="25">
                        25
                    </button>

                    <button
                            type="button"
                            class="option-button active"
                            data-words="50"
                    >
                        50
                    </button>

                    <button type="button" class="option-button" data-words="100">
                        100
                    </button>

                    <button type="button" class="option-button" data-words="250">
                        250
                    </button>
                </div>

                <div id="time-count" class="option-list" hidden>
                    <button type="button" class="option-button" data-time="15">
                        15
                    </button>

                    <button type="button" class="option-button" data-time="30">
                        30
                    </button>

                    <button
                            type="button"
                            class="option-button active"
                            data-time="60"
                    >
                        60
                    </button>

                    <button type="button" class="option-button" data-time="120">
                        120
                    </button>

                    <button type="button" class="option-button" data-time="240">
                        240
                    </button>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <span class="stat-label">WPM</span>
                    <span class="stat-value" id="wpm-display">0</span>
                </div>

                <div class="stat">
                    <span class="stat-label">Accuracy</span>
                    <span class="stat-value" id="accuracy-display">100%</span>
                </div>
            </div>
        </div>

        <div class="typing-area">
            <div
                    id="text-display"
                    aria-live="polite"
                    aria-label="연습할 단어"
            ></div>

            <div class="input-row">
                <input
                        id="input-field"
                        type="text"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        tabindex="1"
                        aria-label="단어 입력"
                        placeholder="여기에 입력하세요..."
                >

                <button
                        id="redo-button"
                        type="button"
                        tabindex="2"
                >
                    ↻ 다시하기
                </button>
            </div>

            <div id="result" class="result">
                <h2 class="result-title">🎉 연습 완료!</h2>

                <div class="result-grid">
                    <div class="result-item">
                        <strong id="result-wpm" class="result-number">0</strong>
                        <span class="result-label">WPM</span>
                    </div>

                    <div class="result-item">
                        <strong id="result-accuracy" class="result-number">
                            100%
                        </strong>
                        <span class="result-label">Accuracy</span>
                    </div>

                    <div class="result-item">
                        <strong id="result-words" class="result-number">0</strong>
                        <span class="result-label">Words</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <p class="help">
        💡 입력창을 클릭하고 단어를 입력하세요. Space 키를 누르면 다음 단어로 이동합니다.
    </p>
</main>

<script>
    "use strict";

    let wordData = {};

    const WORD_DATA_URL = "./json/random.json";

    async function loadWordData() {
        try {
            const response = await fetch(WORD_DATA_URL, {
                method: "GET",
                cache: "no-cache"
            });

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            wordData = await response.json();

            console.log("Word data loaded:", wordData);

            resetTest();

        } catch (error) {
            console.error("단어 데이터를 불러오지 못했습니다.", error);

            textDisplay.textContent =
                "단어 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";

            inputField.disabled = true;
        }
    }

    const punctuationMarks = [".", ",", "!", "?", ";", ":"];

    const textDisplay = document.getElementById("text-display");
    const inputField = document.getElementById("input-field");
    const redoButton = document.getElementById("redo-button");

    const languageSelect = document.getElementById("language-select");
    const punctuationCheckbox =
              document.getElementById("punctuation-checkbox");
    const randomNumbersCheckbox =
              document.getElementById("random-numbers-checkbox");

    const textSizeSlider =
              document.getElementById("text-size-slider");
    const textSizeDisplay =
              document.getElementById("text-size-display");

    const countdownTime =
              document.getElementById("countdown-time");

    const wpmDisplay =
              document.getElementById("wpm-display");
    const accuracyDisplay =
              document.getElementById("accuracy-display");

    const wordCountElement =
              document.getElementById("word-count");
    const timeCountElement =
              document.getElementById("time-count");

    const result = document.getElementById("result");
    const resultWpm = document.getElementById("result-wpm");
    const resultAccuracy =
              document.getElementById("result-accuracy");
    const resultWords =
              document.getElementById("result-words");

    let currentMode = "words";
    let selectedWordCount = 50;
    let selectedTime = 60;

    let words = [];
    let currentWordIndex = 0;

    let correctWords = 0;
    let incorrectWords = 0;
    let typedCharacters = 0;

    let started = false;
    let finished = false;

    let startTime = 0;
    let timerId = null;
    let remainingTime = selectedTime;

    function randomItem(array) {
        return array[Math.floor(Math.random() * array.length)];
    }

    function getCurrentLanguageWords() {
        const languageMap = {
            english1000: "english",
            numbers: "numbers",
            symbols: "symbols",
            german: "german",
            chinese: "chinese",
            spanish: "spanish",
            korean: "korean",
            polish: "polish",
            punjabi: "punjabi",
            swedish: "swedish",
            french: "french",
            arabic: "arabic",
            portuguese: "portuguese",
            russian: "russian",
            finnish: "finnish",
            italian: "italian",
            malaysian: "malaysian",
            dutch: "dutch",
            filipino: "filipino",
            japanese: "japanese",
            vietnamese: "vietnamese"
        };

        const key = languageMap[languageSelect.value];

        if (key && Array.isArray(wordData[key])) {
            return wordData[key];
        }

        return Array.isArray(wordData.english)
            ? wordData.english
            : [];
    }

    function createWord() {
        const source = getCurrentLanguageWords();

        if (!source.length) {
            return "";
        }

        let word = randomItem(source);

        if (
            randomNumbersCheckbox.checked &&
            languageSelect.value !== "numbers" &&
            Math.random() < 0.18
        ) {
            word = String(Math.floor(Math.random() * 999) + 1);
        }

        if (
            punctuationCheckbox.checked &&
            languageSelect.value !== "symbols" &&
            Math.random() < 0.25
        ) {
            word += randomItem(punctuationMarks);
        }

        return word;
    }

    function generateWords(count) {
        const generated = [];

        for (let i = 0; i < count; i += 1) {
            generated.push(createWord());
        }

        return generated;
    }

    function renderWords() {
        textDisplay.innerHTML = "";

        words.forEach(function (word, index) {
            const span = document.createElement("span");

            span.textContent = word + " ";
            span.dataset.index = String(index);

            if (index === currentWordIndex) {
                span.classList.add("current");
            }

            textDisplay.appendChild(span);
        });

        updateDirection();
    }

    function updateDirection() {
        const rtlLanguages = ["arabic"];
        const isRtl = rtlLanguages.includes(languageSelect.value);

        textDisplay.dir = isRtl ? "rtl" : "ltr";
        inputField.dir = isRtl ? "rtl" : "ltr";
    }

    function resetTest() {
        clearInterval(timerId);

        timerId = null;
        started = false;
        finished = false;

        currentWordIndex = 0;
        correctWords = 0;
        incorrectWords = 0;
        typedCharacters = 0;

        inputField.value = "";
        inputField.disabled = false;

        result.classList.remove("show");

        remainingTime = selectedTime;

        const amount =
                  currentMode === "words"
                      ? selectedWordCount
                      : Math.max(250, selectedTime * 4);

        words = generateWords(amount);

        renderWords();
        updateStats();
        updateTimerDisplay();

        window.setTimeout(function () {
            inputField.focus();
        }, 100);
    }

    function startTest() {
        if (started || finished) {
            return;
        }

        started = true;
        startTime = Date.now();

        if (currentMode === "time") {
            timerId = window.setInterval(function () {
                remainingTime -= 1;
                updateTimerDisplay();

                if (remainingTime <= 0) {
                    finishTest();
                }
            }, 1000);
        } else {
            timerId = window.setInterval(function () {
                updateTimerDisplay();
                updateStats();
            }, 500);
        }
    }

    function getElapsedSeconds() {
        if (!started) {
            return 0;
        }

        return Math.max(
            0,
            Math.floor((Date.now() - startTime) / 1000)
        );
    }

    function updateTimerDisplay() {
        let seconds;

        if (currentMode === "time") {
            seconds = Math.max(0, remainingTime);
        } else {
            seconds = getElapsedSeconds();
        }

        const minutes = Math.floor(seconds / 60);
        const restSeconds = seconds % 60;

        countdownTime.textContent =
            minutes +
            ":" +
            String(restSeconds).padStart(2, "0");
    }

    function calculateWpm() {
        const elapsedMinutes =
                  Math.max(getElapsedSeconds(), 1) / 60;

        return Math.round(
            (typedCharacters / 5) / elapsedMinutes
        );
    }

    function calculateAccuracy() {
        const total = correctWords + incorrectWords;

        if (total === 0) {
            return 100;
        }

        return Math.round((correctWords / total) * 100);
    }

    function updateStats() {
        wpmDisplay.textContent = calculateWpm();

        accuracyDisplay.textContent =
            calculateAccuracy() + "%";
    }

    function markCurrentWord(isCorrect) {
        const span = textDisplay.querySelector(
            '[data-index="' + currentWordIndex + '"]'
        );

        if (!span) {
            return;
        }

        span.classList.remove("current");

        span.classList.add(
            isCorrect ? "correct" : "incorrect"
        );
    }

    function highlightNextWord() {
        const nextSpan = textDisplay.querySelector(
            '[data-index="' + currentWordIndex + '"]'
        );

        if (!nextSpan) {
            return;
        }

        nextSpan.classList.add("current");

        nextSpan.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }

    function submitWord() {
        if (finished) {
            return;
        }

        const typedWord = inputField.value.trim();

        if (!typedWord) {
            inputField.value = "";
            return;
        }

        const targetWord = words[currentWordIndex];

        typedCharacters += typedWord.length + 1;

        const isCorrect = typedWord === targetWord;

        if (isCorrect) {
            correctWords += 1;
        } else {
            incorrectWords += 1;
        }

        markCurrentWord(isCorrect);

        currentWordIndex += 1;
        inputField.value = "";

        updateStats();

        if (
            currentMode === "words" &&
            currentWordIndex >= selectedWordCount
        ) {
            finishTest();
            return;
        }

        if (currentWordIndex >= words.length) {
            words.push.apply(words, generateWords(100));
            renderWords();
        }

        highlightNextWord();
    }

    function finishTest() {
        if (finished) {
            return;
        }

        finished = true;

        clearInterval(timerId);
        timerId = null;

        updateStats();

        inputField.disabled = true;

        resultWpm.textContent = calculateWpm();
        resultAccuracy.textContent =
            calculateAccuracy() + "%";
        resultWords.textContent =
            correctWords + incorrectWords;

        result.classList.add("show");
    }

    function setMode(mode) {
        currentMode = mode;

        document.querySelectorAll(".mode-button").forEach(
            function (button) {
                button.classList.toggle(
                    "active",
                    button.dataset.mode === mode
                );
            }
        );

        wordCountElement.hidden = mode !== "words";
        timeCountElement.hidden = mode !== "time";

        resetTest();
    }

    function setWordCount(count) {
        selectedWordCount = count;

        document
        .querySelectorAll("[data-words]")
        .forEach(function (button) {
            button.classList.toggle(
                "active",
                Number(button.dataset.words) === count
            );
        });

        resetTest();
    }

    function setTimeCount(seconds) {
        selectedTime = seconds;
        remainingTime = seconds;

        document
        .querySelectorAll("[data-time]")
        .forEach(function (button) {
            button.classList.toggle(
                "active",
                Number(button.dataset.time) === seconds
            );
        });

        resetTest();
    }

    function adjustTextSize() {
        const size = Number(textSizeSlider.value);

        textSizeDisplay.textContent = size + "px";
        textDisplay.style.fontSize = size + "px";

        const lineHeight = Math.round(size * 1.6);
        textDisplay.style.lineHeight = lineHeight + "px";
    }

    textSizeSlider.addEventListener("input", adjustTextSize);

    languageSelect.addEventListener("change", resetTest);

    punctuationCheckbox.addEventListener(
        "change",
        resetTest
    );

    randomNumbersCheckbox.addEventListener(
        "change",
        resetTest
    );

    redoButton.addEventListener("click", function () {
        resetTest();
    });

    document
    .querySelectorAll(".mode-button")
    .forEach(function (button) {
        button.addEventListener("click", function () {
            setMode(button.dataset.mode);
        });
    });

    document
    .querySelectorAll("[data-words]")
    .forEach(function (button) {
        button.addEventListener("click", function () {
            setWordCount(Number(button.dataset.words));
        });
    });

    document
    .querySelectorAll("[data-time]")
    .forEach(function (button) {
        button.addEventListener("click", function () {
            setTimeCount(Number(button.dataset.time));
        });
    });

    inputField.addEventListener("input", function () {
        if (!started && inputField.value.length > 0) {
            startTest();
        }
    });

    inputField.addEventListener("keydown", function (event) {
        if (event.key !== " ") {
            return;
        }

        event.preventDefault();

        if (!started) {
            startTest();
        }

        submitWord();
    });


    adjustTextSize();
    loadWordData();
</script>
</body>
</html>
