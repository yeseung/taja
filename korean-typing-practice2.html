<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="설치 없이 즐기는 한국어 타자 연습. 30초와 60초 모드, 타수, 정확도, 오타 수를 실시간으로 확인할 수 있습니다.">
    <meta name="keywords" content="한국어 타자연습, 한글 타자연습, 타자 속도, KPM, typing practice">
    <meta property="og:title" content="한국어 타자 연습">
    <meta property="og:description" content="한국어 문장을 입력하며 타수와 정확도를 측정하는 무료 웹 타자연습입니다.">
    <meta property="og:type" content="website">
    <title>한국어 타자 연습</title>

    <!-- https://hangulspace.com/ko/도구/korean-typing-speed-test/ -->

    <style>
        :root {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --line: #e5e7eb;
            --line-strong: #d1d5db;
            --primary: #111827;
            --primary-soft: #f3f4f6;
            --success: #15803d;
            --success-bg: #f0fdf4;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --focus: #2563eb;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            --radius: 24px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", Arial, sans-serif;
            letter-spacing: -0.03em;
            line-height: 1.6;
        }

        button,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .app {
            width: min(920px, calc(100% - 32px));
            margin: 40px auto;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.2;
            font-weight: 800;
        }

        .header p {
            margin: 0;
            color: var(--muted);
            font-size: 15px;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 24px;
        }

        .mode-btn,
        .secondary-btn,
        .primary-btn {
            min-height: 48px;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: #fff;
            color: var(--text);
            font-weight: 700;
            transition: 0.18s ease;
        }

        .mode-btn:hover,
        .secondary-btn:hover {
            background: var(--primary-soft);
        }

        .mode-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .stat-box {
            padding: 16px;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            line-height: 1.2;
        }

        .prompt-box {
            margin-top: 24px;
            min-height: 148px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
        }

        .prompt-text {
            font-size: clamp(22px, 4vw, 32px);
            line-height: 1.75;
            font-weight: 700;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .char {
            border-radius: 4px;
        }

        .char.correct {
            color: var(--success);
            background: var(--success-bg);
        }

        .char.incorrect {
            color: var(--danger);
            background: var(--danger-bg);
            text-decoration: underline;
            text-decoration-thickness: 2px;
        }

        .char.current {
            background: #eff6ff;
            box-shadow: inset 0 -2px 0 var(--focus);
        }

        .next-btn {
            align-self: flex-end;
            border: 0;
            background: transparent;
            color: #9ca3af;
            font-weight: 700;
            padding: 4px 0;
        }

        .next-btn.ready {
            color: var(--text);
        }

        .learning-bar {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .audio-btn,
        .meaning-btn {
            min-height: 44px;
            padding: 0 16px;
            border-radius: 14px;
            border: 1px solid var(--line-strong);
            background: #fff;
            color: var(--text);
            font-weight: 700;
        }

        .audio-btn.playing {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .lang-select {
            min-height: 44px;
            padding: 0 40px 0 14px;
            border: 1px solid var(--line-strong);
            border-radius: 14px;
            background: #fff;
            color: var(--text);
            outline: none;
        }

        .meaning-display {
            margin-top: 12px;
            padding: 16px;
            border-radius: 16px;
            background: var(--primary-soft);
            color: #374151;
            font-weight: 600;
        }

        .input-wrap {
            margin-top: 20px;
        }

        .typing-input {
            width: 100%;
            min-height: 104px;
            resize: vertical;
            padding: 18px;
            border: 1px solid var(--line-strong);
            border-radius: 18px;
            background: #fff;
            color: var(--text);
            outline: none;
            font-size: 18px;
            line-height: 1.6;
        }

        .typing-input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-hint {
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .personal-best {
            color: var(--muted);
            font-size: 14px;
        }

        .personal-best strong {
            color: var(--text);
        }

        .secondary-btn {
            padding: 0 18px;
        }

        .result-card {
            margin-top: 24px;
            padding: 28px;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: #fff;
        }

        .result-card[hidden] {
            display: none;
        }

        .result-card h2 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .result-speed {
            margin: 8px 0 2px;
            font-size: clamp(48px, 10vw, 72px);
            line-height: 1;
            font-weight: 900;
        }

        .result-unit {
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 24px 0;
        }

        .result-item {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 16px;
        }

        .result-item span {
            display: block;
            color: var(--muted);
            font-size: 12px;
        }

        .result-item strong {
            display: block;
            margin-top: 3px;
            font-size: 22px;
        }

        .primary-btn {
            padding: 0 24px;
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .footer-note {
            margin-top: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 720px) {
            .app {
                width: min(100% - 20px, 920px);
                margin: 16px auto;
            }

            .card {
                padding: 20px;
                border-radius: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .prompt-box {
                padding: 18px;
            }

            .controls {
                align-items: stretch;
                flex-direction: column;
            }

            .secondary-btn {
                width: 100%;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 460px) {
            .mode-selector {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                gap: 8px;
            }

            .stat-box {
                padding: 13px 8px;
            }

            .stat-value {
                font-size: 21px;
            }

            .learning-bar {
                align-items: stretch;
            }

            .audio-btn,
            .meaning-btn,
            .lang-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<main class="app">
    <section class="card">
        <header class="header">
            <h1>⌨️ 한국어 타자 연습</h1>
            <p>시간 안에 가능한 많은 문장을 입력해 보세요. 문장을 완료하면 다음 문장으로 자동 이동합니다.</p>

            <div class="mode-selector" role="group" aria-label="타자 연습 시간 선택">
                <button type="button" class="mode-btn active" data-time="30" aria-pressed="true">30초 · 빠른 연습</button>
                <button type="button" class="mode-btn" data-time="60" aria-pressed="false">60초 · 기본 연습</button>
            </div>
        </header>

        <section class="stats-grid" aria-label="타자 통계">
            <div class="stat-box">
                <div class="stat-label">남은 시간</div>
                <div class="stat-value" id="timeDisplay" aria-live="polite">00:30</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">타수 KPM</div>
                <div class="stat-value" id="speedDisplay" aria-live="polite">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">정확도</div>
                <div class="stat-value" id="accuracyDisplay" aria-live="polite">100%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">오타</div>
                <div class="stat-value" id="mistakesDisplay" aria-live="polite">0</div>
            </div>
        </section>

        <section class="prompt-box" id="promptBox" aria-live="polite"></section>

        <section class="learning-bar" aria-label="문장 학습 기능">
            <button type="button" class="audio-btn" id="audioButton">🔊 <span id="audioLabel">듣기</span></button>
            <button type="button" class="meaning-btn" id="meaningButton">🌐 뜻 보기</button>

            <select class="lang-select" id="languageSelect" aria-label="번역 언어 선택">
                <option value="mn">🇲🇳 Монгол</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="es">🇲🇽 Español</option>
                <option value="id">🇮🇩 Bahasa Indonesia</option>
                <option value="th">🇹🇭 ไทย</option>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="zh">🇨🇳 简体中文</option>
                <option value="en" selected>🇺🇸 English</option>
            </select>
        </section>

        <div class="meaning-display" id="meaningDisplay" hidden></div>

        <div class="input-wrap">
        <textarea
                class="typing-input"
                id="typingInput"
                rows="2"
                placeholder="위의 한국어 문장을 입력하세요."
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-label="타자 입력"
        ></textarea>
            <div class="input-hint" id="inputHint">입력을 시작하면 타이머가 작동합니다. Enter를 누르면 다음 문장으로 이동합니다.</div>
        </div>

        <div class="controls">
            <div class="personal-best" id="personalBest">
                개인 최고 기록: <strong>0 KPM</strong>
            </div>
            <button type="button" class="secondary-btn" id="restartButton">다시 시작</button>
        </div>

        <section class="result-card" id="resultCard" hidden>
            <h2>🎉 연습 완료</h2>
            <div class="result-speed" id="resultSpeed">0</div>
            <div class="result-unit">KPM · Korean Keystrokes Per Minute</div>

            <div class="result-grid">
                <div class="result-item">
                    <span>정확도</span>
                    <strong id="resultAccuracy">100%</strong>
                </div>
                <div class="result-item">
                    <span>오타</span>
                    <strong id="resultMistakes">0</strong>
                </div>
                <div class="result-item">
                    <span>완료 문장</span>
                    <strong id="resultCompleted">0</strong>
                </div>
            </div>

            <button type="button" class="primary-btn" id="tryAgainButton">다시 연습</button>
        </section>
    </section>

    <div class="footer-note">광고 · Bootstrap · 랭킹 기능 없이 동작하는 순수 HTML/CSS/JavaScript 버전</div>
</main>

    const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
    const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

    const STROKES = {
        'ㄱ':1,'ㄲ':2,'ㄴ':1,'ㄷ':1,'ㄸ':2,'ㄹ':1,'ㅁ':1,'ㅂ':1,'ㅃ':2,'ㅅ':1,'ㅆ':2,'ㅇ':1,'ㅈ':1,'ㅉ':2,'ㅊ':1,'ㅋ':1,'ㅌ':1,'ㅍ':1,'ㅎ':1,
        'ㅏ':1,'ㅐ':1,'ㅑ':1,'ㅒ':2,'ㅓ':1,'ㅔ':1,'ㅕ':1,'ㅖ':2,'ㅗ':1,'ㅘ':2,'ㅙ':2,'ㅚ':2,'ㅛ':1,'ㅜ':1,'ㅝ':2,'ㅞ':2,'ㅟ':2,'ㅠ':1,'ㅡ':1,'ㅢ':2,'ㅣ':1,
        'ㄳ':2,'ㄵ':2,'ㄶ':2,'ㄺ':2,'ㄻ':2,'ㄼ':2,'ㄽ':2,'ㄾ':2,'ㄿ':2,'ㅀ':2,'ㅄ':2
    };

    const modeButtons = document.querySelectorAll('.mode-btn');
    const timeDisplay = document.getElementById('timeDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const mistakesDisplay = document.getElementById('mistakesDisplay');
    const promptBox = document.getElementById('promptBox');
    const typingInput = document.getElementById('typingInput');
    const inputHint = document.getElementById('inputHint');
    const restartButton = document.getElementById('restartButton');
    const tryAgainButton = document.getElementById('tryAgainButton');
    const resultCard = document.getElementById('resultCard');
    const resultSpeed = document.getElementById('resultSpeed');
    const resultAccuracy = document.getElementById('resultAccuracy');
    const resultMistakes = document.getElementById('resultMistakes');
    const resultCompleted = document.getElementById('resultCompleted');
    const personalBest = document.getElementById('personalBest');
    const audioButton = document.getElementById('audioButton');
    const audioLabel = document.getElementById('audioLabel');
    const meaningButton = document.getElementById('meaningButton');
    const languageSelect = document.getElementById('languageSelect');
    const meaningDisplay = document.getElementById('meaningDisplay');

    let selectedTime = 30;
    let currentSentenceIndex = 0;
    let lastSentenceIndex = -1;
    let sentenceQueue = [];

    let timerId = null;
    let startTime = 0;
    let isRunning = false;
    let isFinished = false;
    let isComposing = false;

    let sessionTypedStrokes = 0;
    let sessionCorrectStrokes = 0;
    let completedMistakes = 0;
    let currentHighestMistakes = 0;
    let sentencesCompleted = 0;
    let previousInput = '';

    let showMeaning = false;
    let selectedLanguage = 'en';
    let currentAudio = null;

    function shuffle(items) {
        const array = items.slice();

        for (let i = array.length - 1; i > 0; i -= 1) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }

        return array;
    }

    function escapeHtml(value) {
        return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getCharStrokes(char) {
        if (!char) return 0;

        const code = char.charCodeAt(0);

        if (code >= 0xAC00 && code <= 0xD7A3) {
            const index = code - 0xAC00;
            const choIndex = Math.floor(index / 588);
            const jungIndex = Math.floor((index % 588) / 28);
            const jongIndex = index % 28;

            let count = (STROKES[CHO[choIndex]] || 1) + (STROKES[JUNG[jungIndex]] || 1);

            if (jongIndex !== 0) {
                count += STROKES[JONG[jongIndex]] || 1;
            }

            return count;
        }

        return STROKES[char] || 1;
    }

    function pickNextSentence() {
        stopAudio();

        if (sentenceQueue.length === 0) {
            const indexes = SENTENCES
            .map((sentence, index) => index)
            .filter((index) => index !== lastSentenceIndex || SENTENCES.length <= 1);

            sentenceQueue = shuffle(indexes);
        }

        currentSentenceIndex = sentenceQueue.pop();
        lastSentenceIndex = currentSentenceIndex;
        currentHighestMistakes = 0;

        renderPrompt('');
        updateMeaning();
    }

    function renderPrompt(typedText) {
        const target = SENTENCES[currentSentenceIndex].text;
        let html = '<div class="prompt-text">';

        for (let i = 0; i < target.length; i += 1) {
            const targetChar = target.charAt(i);
            const typedChar = typedText.charAt(i);
            const displayChar = targetChar === ' ' ? '&nbsp;' : escapeHtml(targetChar);
            let className = 'char';

            if (i < typedText.length) {
                className += typedChar === targetChar ? ' correct' : ' incorrect';
            } else if (i === typedText.length && !isFinished) {
                className += ' current';
            }

            html += `<span class="${className}">${displayChar}</span>`;
        }

        const ready = !isFinished && typedText.trim().length > 0 ? ' ready' : '';

        html += `</div><button type="button" class="next-btn${ready}" id="nextButton">다음 문장 ↵</button>`;
        promptBox.innerHTML = html;
    }

    function normalizeTypedText(value) {
        return value.replace(/\r?\n|\r/g, '').replace(/\u00A0/g, ' ');
    }

    function isMatched() {
        const target = SENTENCES[currentSentenceIndex].text.replace(/\u00A0/g, ' ').trim();
        const typed = normalizeTypedText(typingInput.value).trim();
        return typed === target;
    }

    function countCurrentMistakes(typed, target) {
        let mistakes = 0;
        const minLength = Math.min(typed.length, target.length);

        for (let i = 0; i < minLength; i += 1) {
            if (typed.charAt(i) !== target.charAt(i)) {
                mistakes += 1;
            }
        }

        if (typed.length > target.length) {
            mistakes += typed.length - target.length;
        }

        return mistakes;
    }

    function updateStats() {
        if (!isRunning && !isFinished) return;

        const elapsedSeconds = Math.max(0.1, (Date.now() - startTime) / 1000);
        const kpm = Math.round((sessionTypedStrokes / elapsedSeconds) * 60);
        const accuracy = sessionTypedStrokes > 0
            ? Math.max(0, Math.round((sessionCorrectStrokes / sessionTypedStrokes) * 100))
            : 100;

        speedDisplay.textContent = String(kpm);
        accuracyDisplay.textContent = `${accuracy}%`;
        mistakesDisplay.textContent = String(completedMistakes + currentHighestMistakes);
    }

    function handleInput() {
        if (isFinished) return;

        if (!isRunning) {
            startTest();
        }

        const target = SENTENCES[currentSentenceIndex].text;
        const typed = normalizeTypedText(typingInput.value);

        if (typed.length > previousInput.length) {
            const added = typed.substring(previousInput.length);

            for (let i = 0; i < added.length; i += 1) {
                const position = previousInput.length + i;
                const typedChar = added.charAt(i);
                const targetChar = target.charAt(position) || '';
                const strokes = getCharStrokes(typedChar);

                sessionTypedStrokes += strokes;

                if (typedChar === targetChar) {
                    sessionCorrectStrokes += strokes;
                }
            }
        }

        previousInput = typed;

        if (!isComposing) {
            const mistakes = countCurrentMistakes(typed, target);
            currentHighestMistakes = Math.max(currentHighestMistakes, mistakes);
        }

        renderPrompt(typed);

        if (isMatched()) {
            advanceSentence();
        } else {
            updateStats();
        }
    }

    function advanceSentence() {
        if (isFinished) return;

        completedMistakes += currentHighestMistakes;
        sentencesCompleted += 1;
        currentHighestMistakes = 0;
        previousInput = '';
        typingInput.value = '';

        pickNextSentence();
        updateStats();
        typingInput.focus();
    }

    function startTest() {
        if (isRunning || isFinished) return;

        isRunning = true;
        startTime = Date.now();

        timerId = window.setInterval(() => {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const remaining = Math.max(0, selectedTime - elapsed);

            timeDisplay.textContent = formatTime(remaining);
            updateStats();

            if (remaining <= 0) {
                finishTest();
            }
        }, 200);
    }

    function finishTest() {
        if (timerId) {
            window.clearInterval(timerId);
        }

        timerId = null;
        isRunning = false;
        isFinished = true;

        typingInput.value = '';
        typingInput.disabled = true;
        inputHint.hidden = true;

        stopAudio();
        renderPrompt('');
        updateStats();

        const finalSpeed = Number(speedDisplay.textContent) || 0;
        savePersonalBest(finalSpeed);

        resultSpeed.textContent = String(finalSpeed);
        resultAccuracy.textContent = accuracyDisplay.textContent;
        resultMistakes.textContent = mistakesDisplay.textContent;
        resultCompleted.textContent = String(sentencesCompleted);
        resultCard.hidden = false;
    }

    function resetTest() {
        if (timerId) {
            window.clearInterval(timerId);
        }

        timerId = null;
        isRunning = false;
        isFinished = false;
        isComposing = false;

        sessionTypedStrokes = 0;
        sessionCorrectStrokes = 0;
        completedMistakes = 0;
        currentHighestMistakes = 0;
        sentencesCompleted = 0;
        previousInput = '';
        sentenceQueue = [];

        typingInput.disabled = false;
        typingInput.value = '';
        inputHint.hidden = false;

        timeDisplay.textContent = formatTime(selectedTime);
        speedDisplay.textContent = '0';
        accuracyDisplay.textContent = '100%';
        mistakesDisplay.textContent = '0';
        resultCard.hidden = true;

        stopAudio();
        loadPersonalBest();
        pickNextSentence();

        window.setTimeout(() => typingInput.focus(), 100);
    }

    function formatTime(totalSeconds) {
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');

        return `${minutes}:${seconds}`;
    }

    function getPersonalBestKey() {
        return `korean_typing_pb_${selectedTime}`;
    }

    function loadPersonalBest() {
        let best = 0;

        try {
            best = Number(localStorage.getItem(getPersonalBestKey())) || 0;
        } catch (error) {
            best = 0;
        }

        personalBest.innerHTML = `개인 최고 기록 (${selectedTime}초): <strong>${best} KPM</strong>`;
    }

    function savePersonalBest(kpm) {
        try {
            const currentBest = Number(localStorage.getItem(getPersonalBestKey())) || 0;

            if (kpm > currentBest) {
                localStorage.setItem(getPersonalBestKey(), String(kpm));
            }
        } catch (error) {
            // localStorage를 사용할 수 없는 환경에서는 기록 저장을 건너뜁니다.
        }

        loadPersonalBest();
    }

    function updateMeaning() {
        if (!showMeaning) {
            meaningDisplay.hidden = true;
            meaningButton.textContent = '🌐 뜻 보기';
            return;
        }

        const sentence = SENTENCES[currentSentenceIndex];
        meaningDisplay.textContent = sentence.translations?.[selectedLanguage] || '';
        meaningDisplay.hidden = false;
        meaningButton.textContent = '🙈 뜻 숨기기';
    }

    function getAudioUrl(filename) {
        if (!filename) return '';

        if (
            location.protocol === 'file:' ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1'
        ) {
            return `audio/ktt/${filename}`;
        }

        return `/wp-content/uploads/2026/08/${filename}`;
    }

    function stopAudio() {
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }

        audioButton.classList.remove('playing');
        audioLabel.textContent = '듣기';
    }

    function fallbackSpeech(text) {
        if (!('speechSynthesis' in window)) {
            audioLabel.textContent = '재생 불가';
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 1.1;
        utterance.onend = stopAudio;
        utterance.onerror = stopAudio;

        window.speechSynthesis.speak(utterance);
    }

    function playAudio() {
        if (audioButton.classList.contains('playing')) {
            stopAudio();
            return;
        }

        stopAudio();

        const sentence = SENTENCES[currentSentenceIndex];
        const audioUrl = getAudioUrl(sentence.audio);

        audioButton.classList.add('playing');
        audioLabel.textContent = '재생 중';

        const audio = new Audio(audioUrl);
        audio.playbackRate = 1.1;
        currentAudio = audio;

        audio.onended = stopAudio;
        audio.onerror = () => {
            currentAudio = null;
            fallbackSpeech(sentence.text);
        };

        audio.play().catch(() => {
            currentAudio = null;
            fallbackSpeech(sentence.text);
        });
    }

    typingInput.addEventListener('compositionstart', () => {
        isComposing = true;
    });

    typingInput.addEventListener('compositionend', () => {
        isComposing = false;
        handleInput();
    });

    typingInput.addEventListener('input', handleInput);

    typingInput.addEventListener('keydown', (event) => {
        if (isFinished) return;

        if (event.key === 'Enter') {
            event.preventDefault();

            if (typingInput.value.trim().length > 0 || isMatched()) {
                if (!isRunning) startTest();
                advanceSentence();
            }
        }
    });

    promptBox.addEventListener('click', (event) => {
        const button = event.target.closest('#nextButton');

        if (!button || isFinished) return;

        if (typingInput.value.trim().length > 0 || isMatched()) {
            if (!isRunning) startTest();
            advanceSentence();
        }
    });

    modeButtons.forEach((button) => {
        button.addEventListener('click', () => {
            modeButtons.forEach((item) => {
                item.classList.remove('active');
                item.setAttribute('aria-pressed', 'false');
            });

            button.classList.add('active');
            button.setAttribute('aria-pressed', 'true');
            selectedTime = Number(button.dataset.time) || 30;
            resetTest();
        });
    });

    restartButton.addEventListener('click', resetTest);
    tryAgainButton.addEventListener('click', resetTest);

    meaningButton.addEventListener('click', () => {
        showMeaning = !showMeaning;
        updateMeaning();
    });

    languageSelect.addEventListener('change', () => {
        selectedLanguage = languageSelect.value;
        updateMeaning();
    });

    audioButton.addEventListener('click', playAudio);

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && isRunning) {
            finishTest();
        }
    });

    resetTest();
</script>
