<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>어린이를 위한 타자 연습</title>

    <!-- https://m.blog.naver.com/artifend/224376391050 -->

    <link rel="manifest" href="https://kids-taja.netlify.app/manifest.json">
    <meta name="theme-color" content="#8ec5fc">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="https://kids-taja.netlify.app/icon-192.png">
    <link rel="apple-touch-icon" href="https://kids-taja.netlify.app/icon-192.png">
    <!--
    ★ 개선판 안내 ★
    - 외부 라이브러리(Tailwind, confetti CDN) 의존 제거: 인터넷이 없어도 완전히 동작합니다.
    - 폰트(Jua)만 온라인일 때 예쁘게 적용되고, 오프라인이면 기본 한글 글꼴로 자동 대체됩니다.
    - 한글 조합(IME) 처리, 자모 기준 타수 계산, 기록 백업/복원 기능이 추가되었습니다.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Jua\&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
            min-height: 100vh;
            background-color: #fdfbfb;
            background-image: linear-gradient(120deg, #e0c3fc 0%, #8ec5fc 100%);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            color: #334155;
        }

        /* 폭죽 캔버스 (화면 전체를 덮되 클릭은 통과) */
        #fx {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 50;
        }

        .wrap {
            display: flex;
            gap: 22px;
            width: 100%;
            max-width: 1200px;
            align-items: flex-start;
        }

        .card {
            background: rgba(255, 255, 255, .92);
            border: 1px solid rgba(255, 255, 255, .6);
            border-radius: 26px;
            box-shadow: 0 12px 30px rgba(80, 70, 160, .18);
            padding: 26px;
        }

        .game {
            flex: 1;
            min-width: 0;
        }

        .game header {
            text-align: center;
            margin-bottom: 20px;
        }

        .game h1 {
            font-size: 2.4rem;
            color: #1e293b;
            letter-spacing: 1px;
        }

        .game header p {
            color: #64748b;
            margin-top: 4px;
            font-size: 1.05rem;
        }

        /* 시간/난이도 선택 패널 */
        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .panel {
            border-radius: 18px;
            padding: 14px;
        }

        .panel h2 {
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .panel.time {
            background: #eff6ff;
            border: 1px solid #dbeafe;
        }

        .panel.time h2 {
            color: #1d4ed8;
        }

        .panel.level {
            background: #fff7ed;
            border: 1px solid #ffedd5;
        }

        .panel.level h2 {
            color: #c2410c;
        }

        .btns {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        .btns button {
            font: inherit;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 8px 14px;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .12);
            transition: transform .1s, filter .1s;
        }

        .btns button:focus-visible {
            outline: 3px solid #6366f1;
            outline-offset: 2px;
        }

        .panel.time .btns button {
            background: #60a5fa;
        }

        .panel.time .btns button:hover {
            background: #3b82f6;
        }

        .panel.level .btns button {
            background: #fb923c;
        }

        .panel.level .btns button:hover {
            background: #f97316;
        }

        .btns button.on {
            transform: translateY(2px);
            filter: brightness(.9);
            box-shadow: inset 0 3px 5px rgba(0, 0, 0, .25), 0 0 0 4px rgba(99, 102, 241, .35);
        }

        /* 상태 표시줄 */
        .status {
            display: flex;
            justify-content: space-between;
            background: #f8fafc;
            border-radius: 16px;
            padding: 14px 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, .06);
            font-size: 1.25rem;
            color: #475569;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status b {
            font-size: 1.35rem;
        }

        #timeDisplay {
            color: #ef4444;
        }

        #scoreDisplay {
            color: #3b82f6;
        }

        #speedDisplay {
            color: #16a34a;
        }

        /* 타자 입력 무대 */
        .stage {
            background: #fff;
            border: 2px solid #f1f5f9;
            border-radius: 18px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 20px;
            gap: 26px;
        }

        #targetWord {
            font-size: clamp(1.6rem, 3.5vw, 2.6rem);
            font-weight: normal; /* 얇은 글씨: ㄹ, ㅂ 등 획 구분이 쉬움 */
            line-height: 1.9;
            text-align: center;
            color: #1f2937;
            word-break: keep-all;
        }

        .ch {
            display: inline-block;
            min-width: .55em;
            margin: 0 2px;
            border-bottom: 3px solid #e2e8f0;
            text-align: center;
        }

        .ch.sp {
            min-width: .8em;
            border-bottom-style: dashed;
            border-bottom-color: #cbd5e1;
        }

        .ch.ok {
            color: #3b82f6;
            border-bottom-color: #3b82f6;
        }

        .ch.bad {
            color: #ef4444;
            border-bottom-color: #ef4444;
        }

        .ch.sp.bad {
            background: #fecaca;
            border-bottom-style: solid;
        }

        .ch.cur {
            border-bottom-color: #ec4899;
        }

        .extra {
            display: inline-block;
            margin-left: 8px;
            padding: 0 10px;
            border-radius: 10px;
            background: #fee2e2;
            color: #dc2626;
            font-size: .55em;
            vertical-align: middle;
        }

        #inputWrap {
            width: 100%;
            max-width: 520px;
        }

        #inputField {
            width: 100%;
            font: inherit;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: normal;
            text-align: center;
            padding: 14px;
            border: 4px solid #c7d2fe;
            border-radius: 16px;
            color: #1f2937;
        }

        #inputField::placeholder {
            color: #cbd5e1;
        }

        #inputField:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 5px rgba(129, 140, 248, .25);
        }

        #inputField:disabled {
            background: #f8fafc;
        }

        .stage-btns {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stage-btns button {
            font: inherit;
            border: none;
            cursor: pointer;
            border-radius: 999px;
            transition: transform .12s, box-shadow .12s;
        }

        .stage-btns button:focus-visible {
            outline: 3px solid #6366f1;
            outline-offset: 2px;
        }

        #startButton {
            background: #6366f1;
            color: #fff;
            font-size: 1.4rem;
            padding: 14px 42px;
            box-shadow: 0 8px 18px rgba(99, 102, 241, .4);
        }

        #startButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 22px rgba(99, 102, 241, .45);
        }

        #startButton.playing {
            background: #3b82f6;
        }

        #skipButton {
            background: #e2e8f0;
            color: #475569;
            font-size: 1.05rem;
            padding: 12px 22px;
        }

        #skipButton:hover {
            background: #cbd5e1;
        }

        [hidden] {
            display: none !important;
        }

        /* 명예의 전당 */
        .rank {
            width: 360px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            max-height: 860px;
        }

        .rank h2 {
            font-size: 1.5rem;
            text-align: center;
            color: #1e293b;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 12px;
            font-weight: normal;
        }

        .rank h2 small {
            color: #94a3b8;
            font-size: .95rem;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .tabs button {
            font: inherit;
            font-size: .85rem;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #64748b;
            border-radius: 999px;
            padding: 5px 12px;
            cursor: pointer;
        }

        .tabs button.on {
            background: #6366f1;
            border-color: #6366f1;
            color: #fff;
        }

        .tabs button:focus-visible {
            outline: 3px solid #6366f1;
            outline-offset: 2px;
        }

        #rankingList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 6px;
            min-height: 200px;
        }

        #rankingList::-webkit-scrollbar {
            width: 8px;
        }

        #rankingList::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }

        #rankingList::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            padding: 10px 12px;
        }

        .rank-item .medal {
            width: 64px;
            flex-shrink: 0;
            font-size: 1rem;
            color: #64748b;
            white-space: nowrap;
        }

        .rank-item.r1 .medal {
            color: #d97706;
        }

        .rank-item.r2 .medal {
            color: #94a3b8;
        }

        .rank-item.r3 .medal {
            color: #b45309;
        }

        .rank-item .mid {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .rank-item .mid .pts {
            font-size: 1.05rem;
            color: #1f2937;
        }

        .rank-item .mid .sub {
            font-size: .72rem;
            color: #94a3b8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rank-item .date {
            flex-shrink: 0;
            font-size: .78rem;
            color: #94a3b8;
            white-space: nowrap;
        }

        .empty {
            text-align: center;
            color: #94a3b8;
            margin-top: 40px;
            line-height: 1.7;
        }

        .backup {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .backup button {
            flex: 1;
            font: inherit;
            font-size: .9rem;
            border: 1px dashed #cbd5e1;
            background: #fff;
            color: #64748b;
            border-radius: 12px;
            padding: 9px 0;
            cursor: pointer;
        }

        .backup button:hover {
            background: #f1f5f9;
        }

        .backup button:focus-visible {
            outline: 3px solid #6366f1;
            outline-offset: 2px;
        }

        /* 화면이 좁을 때: 세로 배치 (태블릿 세로모드 대응) */
        @media (max-width: 940px) {
            .wrap {
                flex-direction: column;
            }

            .rank {
                width: 100%;
                max-height: 520px;
            }

            .panels {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
<canvas id="fx"></canvas>

<div class="wrap">

    <!-- 왼쪽: 게임 영역 -->
    <main class="card game">
        <header>
            <h1>🎮 어린이를 위한 타자 연습</h1>
            <p>게임을 하듯 즐겁게 타자를 쳐 보자!</p>
        </header>

        <div class="panels">
            <section class="panel time">
                <h2>⏰ 연습 시간 선택</h2>
                <div class="btns" id="timeBtns">
                    <button data-time="30">30초</button>
                    <button data-time="60">1분</button>
                    <button data-time="120">2분</button>
                    <button data-time="180">3분</button>
                    <button data-time="300">5분</button>
                </div>
            </section>
            <section class="panel level">
                <h2>🔥 난이도 선택</h2>
                <div class="btns" id="levelBtns">
                    <button data-level="1">1단계</button>
                    <button data-level="2">2단계</button>
                    <button data-level="3">3단계</button>
                    <button data-level="4">4단계</button>
                    <button data-level="5">5단계</button>
                    <button data-level="6">6단계</button>
                    <button data-level="7">7단계</button>
                </div>
            </section>
        </div>

        <div class="status">
            <div>남은 시간: <b id="timeDisplay">60</b>초</div>
            <div>점수: <b id="scoreDisplay">0</b>점</div>
            <div>속도: <b id="speedDisplay">0</b>타</div>
        </div>

        <div class="stage">
            <div id="targetWord" aria-live="polite"></div>
            <div id="inputWrap">
                <input type="text" id="inputField" autocomplete="off" placeholder="시작 버튼을 누르세요!" disabled aria-label="타자 입력창">
            </div>
            <div class="stage-btns">
                <button id="startButton">🚀 게임 시작!</button>
                <button id="skipButton" hidden>어려우면 건너뛰기 ➡️</button>
            </div>
        </div>
    </main>

    <!-- 오른쪽: 명예의 전당 -->
    <aside class="card rank">
        <h2>🏆 명예의 전당 <small>(Top 10)</small></h2>
        <div class="tabs" id="rankTabs">
            <button data-filter="all" class="on">전체</button>
            <button data-filter="30">30초</button>
            <button data-filter="60">1분</button>
            <button data-filter="120">2분</button>
            <button data-filter="180">3분</button>
            <button data-filter="300">5분</button>
        </div>
        <div id="rankingList"></div>
        <div class="backup">
            <button id="exportBtn">💾 기록 백업하기</button>
            <button id="importBtn">📂 기록 불러오기</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
        </div>
    </aside>

</div>

    // 2. 자체 제작 폭죽 효과 (외부 라이브러리 없이 동작)
    // ============================================================
    const fxCanvas = document.getElementById('fx');
    const fxCtx = fxCanvas.getContext('2d');
    let fxParticles = [];
    let fxRunning = false;
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function fxResize() {
        fxCanvas.width = window.innerWidth;
        fxCanvas.height = window.innerHeight;
    }

    window.addEventListener('resize', fxResize);
    fxResize();

    function burst(xRatio, yRatio, count, colors) {
        if (REDUCED_MOTION) return;
        const cx = fxCanvas.width * xRatio;
        const cy = fxCanvas.height * yRatio;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 3 + Math.random() * 6;
            fxParticles.push({
                x    : cx, y: cy,
                vx   : Math.cos(angle) * speed,
                vy   : Math.sin(angle) * speed - 3,
                size : 4 + Math.random() * 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                life : 60 + Math.random() * 40,
                rot  : Math.random() * Math.PI,
                vr   : (Math.random() - 0.5) * 0.3
            });
        }
        if (!fxRunning) {
            fxRunning = true;
            requestAnimationFrame(fxLoop);
        }
    }

    function fxLoop() {
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        fxParticles = fxParticles.filter(p => p.life > 0 && p.y < fxCanvas.height + 20);
        for (const p of fxParticles) {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.15;          // 중력
            p.vx *= 0.99;
            p.rot += p.vr;
            p.life--;
            fxCtx.save();
            fxCtx.translate(p.x, p.y);
            fxCtx.rotate(p.rot);
            fxCtx.globalAlpha = Math.min(1, p.life / 30);
            fxCtx.fillStyle = p.color;
            fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            fxCtx.restore();
        }
        if (fxParticles.length > 0) requestAnimationFrame(fxLoop);
        else {
            fxRunning = false;
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        }
    }

    const HAPPY_COLORS = ['#3b82f6', '#ec4899', '#eab308', '#22c55e', '#a855f7'];

    function smallConfetti() {
        burst(0.5, 0.55, 35, HAPPY_COLORS);
    }

    function bigFinale() {
        if (REDUCED_MOTION) return;
        let shots = 0;
        const iv = setInterval(() => {
            burst(0.15 + Math.random() * 0.2, 0.3, 40, HAPPY_COLORS);
            burst(0.65 + Math.random() * 0.2, 0.3, 40, HAPPY_COLORS);
            if (++shots >= 8) clearInterval(iv);
        }, 280);
    }

    // ============================================================
    // 3. 한글 자모 기준 타수 계산 (두벌식 키보드 기준)
    //    - 예: '무릎' = ㅁ+ㅜ+ㄹ+ㅡ+ㅍ = 5타
    //    - 복모음(ㅘ,ㅙ,ㅚ,ㅝ,ㅞ,ㅟ,ㅢ)은 2타, 겹받침(ㄳ,ㄵ 등)도 2타로 계산
    // ============================================================
    const COMPOUND_JUNG = new Set([9, 10, 11, 14, 15, 16, 19]);            // ㅘㅙㅚㅝㅞㅟㅢ
    const COMPOUND_JONG = new Set([3, 5, 6, 9, 10, 11, 12, 13, 14, 15, 18]); // ㄳㄵㄶㄺㄻㄼㄽㄾㄿㅀㅄ

    function countKeystrokes(str) {
        let n = 0;
        for (const ch of str) {
            const code = ch.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {          // 완성형 한글 음절
                const idx = code - 0xAC00;
                const jong = idx % 28;
                const jung = Math.floor(idx / 28) % 21;
                n += 1;                                         // 초성
                n += COMPOUND_JUNG.has(jung) ? 2 : 1;           // 중성
                if (jong > 0) n += COMPOUND_JONG.has(jong) ? 2 : 1; // 종성
            } else {
                n += 1;                                         // 공백, 문장부호, 영문 등
            }
        }
        return n;
    }

    // ============================================================
    // 4. 안전한 기록 저장소 (localStorage 손상 시에도 게임이 멈추지 않음)
    //    - 기존 파일과 같은 저장 키를 사용하므로 이전 기록이 그대로 유지됩니다.
    // ============================================================
    const STORAGE_KEY = 'typing_records';

    function isValidRecord(r) {
        return r && typeof r === 'object'
            && typeof r.score === 'number' && isFinite(r.score)
            && typeof r.time === 'number';
    }

    function loadRecords() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            const parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed.filter(isValidRecord) : [];
        } catch (e) {
            console.warn('기록을 읽는 중 문제가 발생하여 빈 목록으로 시작합니다.', e);
            return [];
        }
    }

    function persistRecords(records) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        } catch (e) {
            console.warn('기록 저장에 실패했습니다. (저장 공간 부족 등)', e);
        }
    }

    // 연습 시간별로 각각 Top 10 까지만 보관 (30초 기록과 5분 기록이 공정하게 공존)
    function trimRecords(records) {
        const sorted = [...records].sort((a, b) => b.score - a.score);
        const countByTime = {};
        const kept = [];
        for (const r of sorted) {
            countByTime[r.time] = (countByTime[r.time] || 0);
            if (countByTime[r.time] < 10) {
                kept.push(r);
                countByTime[r.time]++;
            }
        }
        return kept;
    }

    function addRecord(record) {
        const records = trimRecords([...loadRecords(), record]);
        persistRecords(records);
        renderRanking();
    }

    // ============================================================
    // 5. 게임 상태
    // ============================================================
    let currentLevel = 1;
    let gameDuration = 60;
    let currentWord = '';
    let score = 0;
    let totalKeystrokes = 0;
    let timeLeft = 0;
    let gameStartTime = 0;
    let isGameRunning = false;
    let timerInterval = null;
    let wordPool = {};
    let rankFilter = 'all';
    let isResettingInput = false;   // IME 리셋 중 발생하는 유령 입력을 무시하기 위한 안전장치

    // --- DOM 요소 ---
    const targetWordEl = document.getElementById('targetWord');
    const inputWrap = document.getElementById('inputWrap');
    let inputField = document.getElementById('inputField');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const speedDisplay = document.getElementById('speedDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const startButton = document.getElementById('startButton');
    const skipButton = document.getElementById('skipButton');
    const rankingList = document.getElementById('rankingList');

    // ============================================================
    // 6. 시간/난이도 선택
    // ============================================================
    document.getElementById('timeBtns').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || isGameRunning) return;
        document.querySelectorAll('#timeBtns button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        gameDuration = parseInt(btn.dataset.time, 10);
        timeDisplay.textContent = gameDuration;
    });

    document.getElementById('levelBtns').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || isGameRunning) return;
        document.querySelectorAll('#levelBtns button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        currentLevel = parseInt(btn.dataset.level, 10);
    });

    // ============================================================
    // 7. 단어 덱(중복 방지)과 화면 렌더링
    // ============================================================
    function nextWord() {
        if (!wordPool[currentLevel] || wordPool[currentLevel].length === 0) {
            wordPool[currentLevel] = [...wordDictionary[currentLevel]].sort(() => Math.random() - 0.5);
        }
        currentWord = wordPool[currentLevel].pop();
        renderTargetWord();
    }

    function renderTargetWord() {
        targetWordEl.textContent = '';
        const typed = inputField.value;

        for (let i = 0; i < currentWord.length; i++) {
            const ch = currentWord[i];
            const span = document.createElement('span');
            span.textContent = ch === ' ' ? '\u00A0' : ch;
            span.className = 'ch' + (ch === ' ' ? ' sp' : '');

            if (i < typed.length) {
                span.classList.add(typed[i] === ch ? 'ok' : 'bad');
            } else if (i === typed.length) {
                span.classList.add('cur');
            }
            targetWordEl.appendChild(span);
        }

// 제시어보다 길게 입력한 경우, 초과 글자 수를 표시해 혼란을 방지
        if (typed.length > currentWord.length) {
            const extra = document.createElement('span');
            extra.className = 'extra';
            extra.textContent = '+' + (typed.length - currentWord.length) + ' 지우세요!';
            targetWordEl.appendChild(extra);
        }
    }

    // ============================================================
    // 8. 한글 IME(조합) 처리
    //    - 정답 완성 순간 입력창을 새것으로 교체해 조합 상태를 초기화합니다.
    //    - 이벤트는 입력창이 아니라 바깥 상자(inputWrap)에 연결(이벤트 위임)하므로
    //      입력창을 교체해도 이벤트가 끊어지지 않습니다.
    //    - 교체 도중 발생하는 유령 입력은 isResettingInput 플래그로 걸러냅니다.
    // ============================================================
    function resetInputField() {
        isResettingInput = true;
        const fresh = inputField.cloneNode(false);
        fresh.value = '';
        inputField.replaceWith(fresh);
        inputField = fresh;
        inputField.focus();
        isResettingInput = false;
    }

    inputWrap.addEventListener('input', (e) => {
        if (isResettingInput) {
            e.target.value = '';
            return;
        }
        if (!isGameRunning) {
            e.target.value = '';
            return;
        }

        renderTargetWord();

        if (inputField.value === currentWord) {
            completeWord();
        }
    });

    function completeWord() {
// 점수: 기존 방식 유지 (글자 수 x 단계 x 5) — 예전 기록과의 공정한 비교를 위해
        score += currentWord.length * currentLevel * 5;
        totalKeystrokes += countKeystrokes(currentWord);
        scoreDisplay.textContent = score;
        updateSpeed();
        smallConfetti();

        resetInputField();
        nextWord();
    }

    function updateSpeed() {
        const elapsedMin = (Date.now() - gameStartTime) / 60000;
        if (elapsedMin > 0.01) {
            speedDisplay.textContent = Math.round(totalKeystrokes / elapsedMin);
        }
    }

    // ============================================================
    // 9. 게임 진행 (시작 / 건너뛰기 / 종료)
    // ============================================================
    function startGame() {
        if (timerInterval) clearInterval(timerInterval);

        isGameRunning = true;
        score = 0;
        totalKeystrokes = 0;
        timeLeft = gameDuration;
        gameStartTime = Date.now();
        wordPool[currentLevel] = null;   // 매 게임 새로 섞기

        scoreDisplay.textContent = '0';
        speedDisplay.textContent = '0';
        timeDisplay.textContent = timeLeft;

        inputField.disabled = false;
        inputField.value = '';
        inputField.placeholder = '여기에 입력!';
        inputField.focus();

        startButton.textContent = '🔄 다시 시작';
        startButton.classList.add('playing');
        skipButton.hidden = false;

        nextWord();

        timerInterval = setInterval(() => {
            timeLeft--;
            timeDisplay.textContent = Math.max(0, timeLeft);
            updateSpeed();
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function skipWord() {
        if (!isGameRunning) return;
        resetInputField();
        nextWord();
    }

    function endGame() {
        isGameRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;

        inputField.value = '';
        inputField.disabled = true;
        inputField.placeholder = '수고했어요!';
        skipButton.hidden = true;

        targetWordEl.textContent = '';
        const done = document.createElement('span');
        done.style.color = '#64748b';
        done.textContent = '🎉 게임 종료! 점수: ' + score + '점';
        targetWordEl.appendChild(done);

        if (score > 0) {
            const today = new Date();
            const dateStr = String(today.getFullYear()).slice(2) + '.'
                + String(today.getMonth() + 1).padStart(2, '0') + '.'
                + String(today.getDate()).padStart(2, '0');
            addRecord({
                score: score,
                speed: parseInt(speedDisplay.textContent, 10) || 0,
                level: currentLevel,
                time : gameDuration,
                date : dateStr
            });
            bigFinale();
        }

        startButton.textContent = '🚀 게임 시작!';
        startButton.classList.remove('playing');
    }

    startButton.addEventListener('click', startGame);
    skipButton.addEventListener('click', skipWord);

    // ============================================================
    // 10. 명예의 전당 (시간별 필터 + 안전한 화면 출력)
    //     - textContent만 사용하므로 저장 데이터에 이상한 문자가 있어도 안전합니다.
    // ============================================================
    function formatTime(sec) {
        return sec >= 60 ? (sec / 60) + '분' : sec + '초';
    }

    document.getElementById('rankTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        document.querySelectorAll('#rankTabs button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        rankFilter = btn.dataset.filter;
        renderRanking();
    });

    function renderRanking() {
        const all = loadRecords();
        const filtered = (rankFilter === 'all')
            ? all
            : all.filter(r => String(r.time) === rankFilter);
        const top = [...filtered].sort((a, b) => b.score - a.score).slice(0, 10);

        rankingList.textContent = '';

        if (top.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'empty';
            empty.textContent = '아직 기록이 없습니다. 첫 번째 챔피언이 되어 보세요!';
            rankingList.appendChild(empty);
            return;
        }

        const MEDALS = ['🥇', '🥈', '🥉'];
        top.forEach((r, i) => {
            const item = document.createElement('div');
            item.className = 'rank-item' + (i < 3 ? ' r' + (i + 1) : '');

            const medal = document.createElement('div');
            medal.className = 'medal';
            medal.textContent = (i < 3 ? MEDALS[i] + ' ' : '') + (i + 1) + '위';

            const mid = document.createElement('div');
            mid.className = 'mid';
            const pts = document.createElement('div');
            pts.className = 'pts';
            pts.textContent = r.score.toLocaleString() + '점';
            const sub = document.createElement('div');
            sub.className = 'sub';
            sub.textContent = '속도 ' + (r.speed || 0) + '타 | ' + (r.level || '?') + '단계 | ' + formatTime(r.time);
            mid.appendChild(pts);
            mid.appendChild(sub);

            const date = document.createElement('div');
            date.className = 'date';
            date.textContent = r.date || '';

            item.appendChild(medal);
            item.appendChild(mid);
            item.appendChild(date);
            rankingList.appendChild(item);
        });
    }

    // ============================================================
    // 11. 기록 백업(내보내기) / 복원(가져오기)
    //     - 브라우저 데이터를 지워도 기록을 잃지 않도록 파일로 보관할 수 있습니다.
    // ============================================================
    document.getElementById('exportBtn').addEventListener('click', () => {
        const records = loadRecords();
        if (records.length === 0) {
            alert('아직 백업할 기록이 없습니다.');
            return;
        }
        const blob = new Blob([JSON.stringify(records, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const d = new Date();
        a.href = url;
        a.download = '타자연습_기록_'
            + String(d.getFullYear()).slice(2)
            + String(d.getMonth() + 1).padStart(2, '0')
            + String(d.getDate()).padStart(2, '0') + '.json';
        a.click();
        URL.revokeObjectURL(url);
    });

    const importFile = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', () => {
        const file = importFile.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                if (!Array.isArray(parsed)) throw new Error('형식 오류');
                const incoming = parsed.filter(isValidRecord);
                if (incoming.length === 0) throw new Error('유효한 기록 없음');

// 기존 기록과 합치되, 완전히 같은 기록은 한 번만 남깁니다.
                const merged = [...loadRecords(), ...incoming];
                const seen = new Set();
                const unique = merged.filter(r => {
                    const key = JSON.stringify([r.score, r.speed, r.level, r.time, r.date]);
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });
                persistRecords(trimRecords(unique));
                renderRanking();
                alert('기록 ' + incoming.length + '개를 불러와 합쳤습니다!');
            } catch (e) {
                alert('기록 파일을 읽을 수 없습니다. 백업하기로 만든 파일이 맞는지 확인해 주세요.');
            }
            importFile.value = '';
        };
        reader.readAsText(file);
    });

    // ============================================================
    // 12. 초기화
    // ============================================================
    inputField.disabled = true;
    renderRanking();

    // ============================================================
    // 13. 앱(PWA) 등록 — 인터넷 주소로 열었을 때만 작동하며,
    //     파일로 직접 열면 자동으로 건너뛰므로 기존 사용법에도 영향이 없습니다.
    // ============================================================
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {
            });
        });
    }
</script>
