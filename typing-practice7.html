            "offers":{"@type":"Offer","price":"0","priceCurrency":"KRW"},
            "description":"한글·영문 문장연습과 낱말 낙하 게임으로 타수와 정확도를 측정하는 무료 타자연습 사이트"
        }

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink:#1B1D21; --ink-2:#24272C;
            --paper:#F2EAD8; --paper-dim:#E4DAC2;
            --muted:#8B8375; --brass:#D9A544;
            --sage:#5C8463; --vermillion:#B23A2F; --line:#3A3D42;
        }
        *{box-sizing:border-box;}
        html,body{margin:0;padding:0;overflow-x:hidden;}
        body{
            background:radial-gradient(ellipse at top,#24272C 0%,var(--ink) 55%);
            color:var(--paper);
            font-family:'Noto Sans KR',sans-serif;
            min-height:100vh;
            display:flex; flex-direction:column; align-items:center;
            padding:32px 16px 64px;
        }

        .brand{ text-align:center; margin-bottom:28px; }
        .brand .mark{
            font-family:'Special Elite',cursive; font-size:13px;
            letter-spacing:.35em; color:var(--brass); margin:0 0 6px;
        }
        .brand h1{
            font-family:'Special Elite',cursive; font-size:38px;
            margin:0; color:var(--paper); font-weight:400;
        }

        .controls{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:24px; }
        .seg{ display:flex; background:var(--ink-2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
        .seg button{
            appearance:none; border:none; background:transparent; color:var(--muted);
            font-family:'Noto Sans KR',sans-serif; font-size:14px; padding:9px 16px;
            cursor:pointer; transition:background .15s,color .15s;
        }
        .seg button+button{ border-left:1px solid var(--line); }
        .seg button.active{ background:var(--brass); color:var(--ink); font-weight:500; }
        .seg button:hover:not(.active):not(:disabled){ color:var(--paper); }
        .seg button:disabled{ opacity:.45; cursor:not-allowed; }

        .sheet{
            width:100%; max-width:720px;
            background:var(--paper); color:var(--ink);
            border-radius:4px;
            box-shadow:0 24px 60px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.15) inset;
            padding:36px 32px 28px; position:relative; overflow:hidden;
        }
        .sheet::before{
            content:""; position:absolute; top:10px; left:10px; right:10px; bottom:10px;
            border:1px dashed rgba(27,29,33,.14); pointer-events:none;
        }

        #startScreen{ text-align:center; padding:40px 20px; }
        #startScreen p{ color:#5b5647; font-size:14px; line-height:1.7; margin:0 0 28px; }
        .go-btn{
            appearance:none; border:none; background:var(--ink); color:var(--brass);
            font-family:'Special Elite',cursive; font-size:18px;
            padding:14px 36px; border-radius:3px; cursor:pointer; letter-spacing:.05em;
        }
        .go-btn:hover{ background:#000; }

        #practiceScreen{ display:none; }
        #resultScreen{ display:none; text-align:center; padding:20px; }

        /* --- 입력 영역: 투명 textarea 가 글자 위를 덮는다 (커서 스크롤로 화면이 밀리지 않게) --- */
        .type-area{ position:relative; margin-bottom:14px; cursor:text; }
        .target-text{
            font-family:'JetBrains Mono','Noto Sans KR',monospace;
            font-size:21px; line-height:1.9; letter-spacing:0;
            word-break:break-all; white-space:pre-wrap;
            margin:0; padding:0; border:0;
            min-height:160px;
        }
        /* 입력칸은 글자 영역과 겹치지 않게 아래에 따로 둔다.
        숨긴 입력칸은 기기에 따라 한글 조합 이벤트가 정상 동작하지 않는다. */
        .type-input{
            width:100%;
            font-family:'JetBrains Mono','Noto Sans KR',monospace;
            font-size:17px; padding:11px 13px; margin-bottom:10px;
            border:1px solid rgba(27,29,33,.3); border-radius:4px;
            background:var(--paper-dim); color:var(--ink); outline:none;
        }
        .type-input:focus{ border-color:var(--brass); }
        .type-input::placeholder{ color:#a49a85; font-size:14px; }
        .ch.correct{ color:var(--sage); }
        .ch.wrong{ color:var(--vermillion); border-bottom:2px solid var(--vermillion); }
        .ch.pending{ color:#b7ae98; }
        .ch.current{ box-shadow:inset 0 -3px 0 var(--brass); }
        .ch.composing{ color:var(--ink); font-weight:700; background:rgba(217,165,68,.5); border-radius:2px; box-shadow:inset 0 -3px 0 var(--brass); }

        .composing-view{ display:none;
            font-family:'JetBrains Mono','Noto Sans KR',monospace;
            font-size:15px; color:#7a7362; height:26px; overflow:hidden;
            margin-bottom:12px; white-space:nowrap;
        }
        .composing-view b{
            color:var(--ink); font-weight:500; font-size:19px;
            background:rgba(217,165,68,.28); border-radius:3px; padding:0 6px;
        }

        .stats{
            display:flex; justify-content:space-between;
            border-top:1px solid rgba(27,29,33,.15); padding-top:16px;
            font-family:'JetBrains Mono',monospace; font-size:13px; color:#5b5647;
        }
        .stats .num{ font-size:20px; color:var(--ink); display:block; margin-bottom:2px; }
        .stat-item{ text-align:center; flex:1; }

        .action-row{ display:flex; gap:10px; justify-content:center; margin-top:18px; }
        .action-row button{
            appearance:none; border:1px solid rgba(27,29,33,.35); background:transparent;
            color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:13px;
            padding:9px 18px; border-radius:3px; cursor:pointer;
        }
        .action-row button:hover{ background:rgba(27,29,33,.07); }
        .action-row button.stop{ border-color:var(--vermillion); color:var(--vermillion); }

        .hint{ text-align:center; color:var(--muted); font-size:12px; margin-top:14px; }

        #resultScreen h2{ font-family:'Special Elite',cursive; font-size:26px; color:var(--ink); margin:0 0 4px; }
        #resultScreen .sub{ color:#5b5647; font-size:13px; margin-bottom:24px; }
        .result-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:24px; }
        .result-card{ background:var(--paper-dim); border-radius:6px; padding:16px 8px; }
        .result-card .num{ font-family:'JetBrains Mono',monospace; font-size:26px; color:var(--ink); display:block; }
        .result-card .label{ font-size:12px; color:#5b5647; margin-top:4px; }
        .best-note{ font-size:12px; color:var(--sage); margin-bottom:20px; min-height:16px; }
        .retry-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .retry-row button{
            appearance:none; border:1px solid var(--ink); background:transparent; color:var(--ink);
            font-family:'Noto Sans KR',sans-serif; font-size:14px;
            padding:11px 22px; border-radius:3px; cursor:pointer;
        }
        .retry-row button.primary{ background:var(--ink); color:var(--brass); }

        /* 지문 선택 / 업로드 */
        .source-box{ margin:0 0 20px; }
        .source-box .seg{ display:inline-flex; background:rgba(27,29,33,.07); border-color:rgba(27,29,33,.2); }
        .source-box .seg button{ color:#7a7362; }
        .source-box .seg button.active{ background:var(--ink); color:var(--brass); }
        #customBox{ display:none; margin-top:14px; text-align:left; }
        #fileInput{ display:none; }
        .cb-chunk{
            display:flex; align-items:center; gap:10px; flex-wrap:wrap;
            font-size:12px; color:#5b5647; margin-bottom:12px;
        }
        .cb-chunk .seg{ background:rgba(27,29,33,.07); border-color:rgba(27,29,33,.2); }
        .cb-chunk .seg button{ font-size:12px; padding:6px 12px; color:#7a7362; }
        .cb-chunk .seg button.active{ background:var(--ink); color:var(--brass); }
        .cb-row{ display:flex; gap:8px; margin-bottom:10px; }
        .cb-row button, .cb-save{
            appearance:none; border:1px solid rgba(27,29,33,.35); background:transparent;
            color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:13px;
            padding:9px 14px; border-radius:3px; cursor:pointer;
        }
        .cb-row button:hover, .cb-save:hover{ background:rgba(27,29,33,.07); }
        #customText{
            width:100%; height:110px; resize:vertical;
            font-family:'Noto Sans KR',sans-serif; font-size:13px; line-height:1.6;
            padding:10px 12px; border:1px solid rgba(27,29,33,.25); border-radius:4px;
            background:var(--paper-dim); color:var(--ink); outline:none; margin-bottom:10px;
        }
        #customText:focus{ border-color:var(--brass); }
        .cb-info{ font-size:12px; color:#5b5647; margin:0 0 10px; }
        .cb-save{ background:var(--ink); color:var(--brass); border-color:var(--ink); width:100%; }

        /* 문장 전환 */
        .target-text.slide-in{ animation:slidein .22s ease-out; }
        @keyframes slidein{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

        /* 기록 패널 */
        .stats-panel{
            background:var(--paper-dim); border-radius:6px;
            padding:16px 18px; margin:0 0 24px; text-align:left;
        }
        .sp-top{
            display:flex; justify-content:space-between; align-items:baseline;
            margin-bottom:12px; font-size:13px; color:#5b5647;
        }
        .sp-top b{ font-family:'JetBrains Mono',monospace; font-size:18px; color:var(--ink); }
        .sp-streak{ color:var(--vermillion); font-weight:700; }
        .rec-row{
            display:flex; align-items:center; gap:8px;
            font-size:12px; color:#5b5647; padding:3px 0;
        }
        .rec-row .rec-tag{ width:78px; flex:none; }
        .rec-row .rec-bar{ flex:1; height:7px; background:rgba(27,29,33,.1); border-radius:4px; overflow:hidden; }
        .rec-row .rec-bar i{ display:block; height:100%; background:var(--brass); }
        .rec-row .rec-val{ width:74px; flex:none; text-align:right; font-family:'JetBrains Mono',monospace; color:var(--ink); }
        .sp-empty{ font-size:13px; color:#8b8375; }
        .share-btn{
            appearance:none; border:1px dashed rgba(27,29,33,.45); background:transparent;
            color:#5b5647; font-family:'Noto Sans KR',sans-serif; font-size:13px;
            padding:9px 18px; border-radius:3px; cursor:pointer; margin-bottom:16px;
        }
        .share-btn:hover{ background:rgba(27,29,33,.06); }

        footer{ margin-top:28px; color:var(--muted); font-size:12px; }

        #gameScreen{ display:none; }
        #gameOverScreen{ display:none; text-align:center; padding:20px; }
        #gameOverScreen h2{ font-family:'Special Elite',cursive; font-size:26px; color:var(--ink); margin:0 0 4px; }
        #gameOverScreen .sub{ color:#5b5647; font-size:13px; margin-bottom:24px; }

        .game-bar{
            display:flex; justify-content:space-between; align-items:center;
            font-family:'JetBrains Mono',monospace; font-size:13px; color:#5b5647;
            padding-bottom:10px; border-bottom:1px solid rgba(27,29,33,.15);
        }
        .game-bar b{ color:var(--ink); font-size:17px; }
        #gLives{ color:var(--vermillion); font-size:17px; letter-spacing:2px; }

        .game-field{
            position:relative; height:320px; overflow:hidden;
            background:linear-gradient(180deg,rgba(27,29,33,.03),rgba(27,29,33,.09));
            border-radius:4px; margin:10px 0 12px;
        }
        .game-field .ground{
            position:absolute; left:0; right:0; bottom:0; height:3px;
            background:repeating-linear-gradient(90deg,var(--vermillion) 0 8px,transparent 8px 16px);
            opacity:.6;
        }
        .word{
            position:absolute; white-space:nowrap;
            font-family:'JetBrains Mono','Noto Sans KR',monospace;
            font-size:19px; color:var(--ink);
            background:var(--paper); border:1px solid rgba(27,29,33,.25);
            border-radius:4px; padding:3px 9px;
            box-shadow:0 2px 0 rgba(27,29,33,.12);
            will-change:transform;
        }
        .word.hit{ border-color:var(--brass); box-shadow:0 0 0 2px rgba(217,165,68,.5); }
        .word .done{ color:var(--sage); }
        .word .live{ color:var(--brass); font-weight:700; }
        .word.pop{ animation:pop .18s ease-out forwards; }
        @keyframes pop{ to{ transform:scale(1.4); opacity:0; } }

        .game-input{
            width:100%; font-family:'JetBrains Mono','Noto Sans KR',monospace;
            font-size:17px; padding:11px 13px;
            border:1px solid rgba(27,29,33,.3); border-radius:4px;
            background:var(--paper-dim); color:var(--ink); outline:none;
        }
        .game-input:focus{ border-color:var(--brass); }
        .game-input::placeholder{ color:#a49a85; font-size:14px; }

        @media (max-width:520px){
            .game-field{ height:260px; }
            .word{ font-size:16px; }
        }

        @media (max-width:520px){
            .brand h1{ font-size:28px; }
            .sheet{ padding:26px 18px 22px; }
            .target-text{ font-size:17px; line-height:1.85; }
            .result-card .num{ font-size:20px; }
            .action-row button{ padding:9px 12px; }
        }
    </style>
</head>
<body>

<div class="brand">
    <p class="mark">TYPE · PRACTICE</p>
    <h1>타자연습</h1>
</div>

<div class="controls">
    <div class="seg" id="modeSeg">
        <button data-mode="practice" class="active">문장연습</button>
        <button data-mode="game">낱말게임</button>
    </div>
    <div class="seg" id="langSeg">
        <button data-lang="ko" class="active">한글</button>
        <button data-lang="en">영어</button>
        <button data-lang="mix">혼합</button>
    </div>
    <div class="seg" id="lenSeg">
        <button data-len="short" class="active">짧게</button>
        <button data-len="medium">보통</button>
        <button data-len="long">길게</button>
    </div>
</div>

<div class="sheet">

    <div id="startScreen">
        <p id="startDesc">문장이 끝나면 다음 문장이 곧바로 이어집니다.<br>중지를 누를 때까지 계속되며, 타수와 정확도는 전체 기준으로 누적됩니다.</p>
        <div class="source-box">
            <div class="seg" id="sourceSeg" style="justify-content:center">
                <button data-source="builtin" class="active">기본 문장</button>
                <button data-source="custom">내 문장</button>
            </div>
            <div id="customBox">
                <p class="cb-info" id="customInfo"></p>
                <div class="cb-chunk">
                    <span>한 번에 칠 길이</span>
                    <div class="seg" id="chunkSeg">
                        <button data-chunk="60">60자</button>
                        <button data-chunk="100" class="active">100자</button>
                        <button data-chunk="150">150자</button>
                    </div>
                </div>
                <div class="cb-row">
                    <button id="uploadBtn">텍스트 파일 올리기 (.txt)</button>
                    <button id="clearCustomBtn">지우기</button>
                </div>
                <input type="file" id="fileInput" accept=".txt,text/plain">
                <textarea id="customText" placeholder="여기에 직접 붙여넣어도 됩니다. 줄바꿈과 마침표로 나눈 뒤, 긴 문단은 위에서 고른 길이만큼 공백 단위로 잘라 이어서 연습합니다."></textarea>
                <button id="saveCustomBtn" class="cb-save">저장하고 사용하기</button>
            </div>
        </div>
        <div class="stats-panel" id="statsPanel"></div>
        <button class="go-btn" id="startBtn">시작하기</button>
    </div>

    <div id="practiceScreen">
        <div class="type-area">
            <div class="target-text" id="targetText"></div>
        </div>
        <input type="text" id="hiddenInput" class="type-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="여기에 입력하세요">
        <div class="composing-view" id="composingView">&nbsp;</div>
        <div class="stats">
            <div class="stat-item"><span class="num" id="statTime">0.0s</span>경과시간</div>
            <div class="stat-item"><span class="num" id="statSpeed">0</span><span id="speedUnitLabel">타/분</span></div>
            <div class="stat-item"><span class="num" id="statAccuracy">100%</span>정확도</div>
            <div class="stat-item"><span class="num" id="statCount">0</span>문장</div>
        </div>
        <div class="action-row">
            <button class="stop" id="stopBtn">중지</button>
            <button id="restartBtn">처음부터</button>
            <button id="skipBtn">이 문장 건너뛰기</button>
        </div>
        <p class="hint">아래 칸에 입력하세요 · 문장이 끝나면 다음 문장이 바로 이어집니다</p>
    </div>

    <div id="resultScreen">
        <h2 id="resultTitle">완료!</h2>
        <p class="sub" id="resultSub"></p>
        <div class="result-grid">
            <div class="result-card"><span class="num" id="resSpeed">0</span><span class="label" id="resSpeedLabel">타/분</span></div>
            <div class="result-card"><span class="num" id="resAccuracy">0%</span><span class="label">정확도</span></div>
            <div class="result-card"><span class="num" id="resTime">0.0s</span><span class="label">소요시간</span></div>
        </div>
        <p class="best-note" id="bestNote"></p>
        <button class="share-btn" id="shareBtn">기록 복사하기</button>
        <div class="retry-row">
            <button class="primary" id="retryNewBtn">다시 연습하기</button>
            <button id="toHomeBtn">처음 화면</button>
        </div>
    </div>

    <div id="gameScreen">
        <div class="game-bar">
            <span>레벨 <b id="gLevel">1</b></span>
            <span>점수 <b id="gScore">0</b></span>
            <span id="gLives">♥♥♥</span>
        </div>

        var state = {
            mode:'practice', lang:'ko', len:'short', source:'builtin', custom:[], chunk:100,
            doneChars:0, wrongTotal:0, sentences:0, text:'', spans:[],
            pos:0, wrongSet:{}, keystrokes:0,
            startedAt:null, running:false, composing:false, timerId:null
        };

        var el = {};
        ['langSeg','lenSeg','startScreen','practiceScreen','resultScreen','startBtn',
            'targetText','composingView','hiddenInput','statTime','statSpeed','statAccuracy',
            'speedUnitLabel','resSpeed','resSpeedLabel','resAccuracy','resTime','resultSub',

        function isKo(){ return state.lang==='ko'; }
// 내 문장은 한/영이 섞일 수 있어 '타/분'(실제 누른 키 수) 으로 통일한다
        function isMixed(){ return state.source==='custom' || state.lang==='mix'; }
        function speedUnit(){ return (isMixed()||isKo())?'타/분':'WPM'; }
        function currentPool(){
            if(state.source==='custom' && state.custom.length) return state.custom;
            return SENTENCES[state.lang][state.len];
        }
        function pickText(){
            var pool=currentPool(), t;
            if(!pool.length) return '연습할 문장이 없습니다.';
            do{ t=pool[Math.floor(Math.random()*pool.length)]; }while(pool.length>1 && t===state.text);
            return t;
        }
        function bestKey(){ return 'typing_best_'+state.lang+'_'+state.len; }
        function loadBest(){ try{ return JSON.parse(localStorage.getItem(bestKey())); }catch(e){ return null; } }

        function setActive(seg,attr,v){
            Array.prototype.forEach.call(seg.querySelectorAll('button'),function(b){
                b.classList.toggle('active', b.getAttribute(attr)===v);
            });
        }
        function lockControls(lock){
            Array.prototype.forEach.call(document.querySelectorAll('.seg button'),function(b){ b.disabled=lock; });
        }

        el.langSeg.addEventListener('click',function(e){
            var b=e.target.closest('button'); if(!b||b.disabled) return;
            state.lang=b.getAttribute('data-lang'); setActive(el.langSeg,'data-lang',state.lang);
        });
        el.lenSeg.addEventListener('click',function(e){
            var b=e.target.closest('button'); if(!b||b.disabled) return;
            state.len=b.getAttribute('data-len'); setActive(el.lenSeg,'data-len',state.len);
        });

// 문장 span 을 한 번만 만들어 두고 클래스만 바꾼다 → 글자 위치가 절대 움직이지 않음
        function buildSpans(){
            el.targetText.textContent='';
            state.spans=[];
            var frag=document.createDocumentFragment();
            for(var i=0;i<state.text.length;i++){
                var s=document.createElement('span');
                s.className='ch pending';
                s.textContent=state.text[i];
                frag.appendChild(s);
                state.spans.push(s);
            }
            el.targetText.appendChild(frag);
        }

// 마지막 글자가 아직 완성 전일 수 있는지 판정.
// 일부 안드로이드 IME 는 한 자모마다 조합을 끝내버리므로(마 → 말),
// 마지막 글자가 한글(완성형 또는 단독 자모)이면 무조건 "아직 만드는 중"으로 본다.
        var HANGUL=/[\uAC00-\uD7A3\u3130-\u318F\u1100-\u11FF]/;
        function judgedLength(){
            var v=el.hiddenInput.value;
            if(!v.length) return 0;
            if(state.composing || HANGUL.test(v[v.length-1])) return v.length-1;
            return v.length;
        }

// ----- 한글 자모 분해 -----
        var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
        var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
        var JONG_SPLIT={'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
            'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']};

        function jamo(ch){
            if(!ch) return [];
            var code=ch.charCodeAt(0);
            if(code>=0xAC00 && code<=0xD7A3){
                var s=code-0xAC00;
                var arr=[CHO[Math.floor(s/588)], JUNG[Math.floor((s%588)/28)]];
                var jong=JONG[s%28];
                if(jong) arr=arr.concat(JONG_SPLIT[jong]||[jong]);
                return arr;
            }
            return [ch];
        }

        function evaluate(){
            var v=el.hiddenInput.value;
            if(v.indexOf('\n')>=0){ v=v.replace(/\n/g,''); el.hiddenInput.value=v; }
            if(v.length>state.text.length+1){ v=v.slice(0,state.text.length+1); el.hiddenInput.value=v; }

            var committed = judgedLength();                                    // 조합이 끝나 확정된 글자 수
            var compChar  = (v.length>committed) ? v[committed] : null;        // 지금 만들어지는 중인 글자

// 조합 중인 글자가 이미 목표 글자를 다 포함하는지 판단
// 예) 목표 "하" 를 치고 다음 "루" 의 ㄹ 을 누르면 IME 는 "할" 로 만든다 → "하" 는 완성, "ㄹ" 은 다음 글자 몫
            var done=false, rest='';
            if(compChar){
                var jc=jamo(compChar), jt=jamo(state.text[committed]);
                if(jc.length>=jt.length){
                    var pre=true;
                    for(var k=0;k<jt.length;k++){ if(jc[k]!==jt[k]){ pre=false; break; } }
                    if(pre){ done=true; rest=jc.slice(jt.length).join(''); }
                }
            }

            var compIdx = compChar ? (done ? committed+1 : committed) : -1;   // 지금 만들어지는 중인 칸
            var cursorIdx = done ? committed+1 : committed;
            state.pos = done ? committed+1 : committed;

            for(var i=0;i<state.spans.length;i++){
                var span=state.spans[i], cls, txt=state.text[i];
                if(i<committed){
                    var ok = v[i]===state.text[i];
                    if(!ok) state.wrongSet[i]=true;
                    cls = ok ? 'ch correct' : 'ch wrong';
                } else if(i===committed && done){
                    cls='ch correct';
                } else if(i===compIdx && (!done || rest)){
                    cls='ch composing';
                    txt = done ? rest : compChar;     // ㄱ → 가 → 각 : 친 그대로 그 칸에 표시
                } else if(i===cursorIdx){
                    cls='ch pending current';
                } else {
                    cls='ch pending';
                }
                if(span.textContent!==txt) span.textContent=txt;
                if(span.className!==cls) span.className=cls;
            }

            var showing = done ? rest : compChar;
            el.composingView.innerHTML = showing
                ? '입력 중 <b>'+showing.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</b>'
                : '&nbsp;';

            updateStats();

            if(committed>=state.text.length){ nextSentence(true); return; }
            if(done && !rest && committed+1>=state.text.length){ nextSentence(true); }
        }

// 세션(중지할 때까지) 누적 집계
        function sessionStats(){
            var sec=state.startedAt?(Date.now()-state.startedAt)/1000:0;
            var typed=state.doneChars+state.pos;
            var wrong=state.wrongTotal+Object.keys(state.wrongSet).length;
            var min=sec/60, speed=0;
            if(min>0) speed = (isMixed()||isKo())?Math.round(state.keystrokes/min)
                :Math.round((typed/5)/min);
            return {
                sec:sec, typed:typed, wrong:wrong, speed:speed,
                acc: typed>0?Math.max(0,Math.round(((typed-wrong)/typed)*100)):100
            };
        }

        function updateStats(){
            var st=sessionStats();
            el.statTime.textContent=st.sec.toFixed(1)+'s';
            el.speedUnitLabel.textContent = speedUnit();
            el.statSpeed.textContent = st.speed;
            el.statAccuracy.textContent = st.acc+'%';
            el.statCount.textContent = state.sentences;
        }

        function show(which){
            el.startScreen.style.display    = which==='start' ?'block':'none';
            el.practiceScreen.style.display = which==='run'   ?'block':'none';
            el.resultScreen.style.display   = which==='result'?'block':'none';
            el.gameScreen.style.display     = which==='game'  ?'block':'none';
            el.gameOverScreen.style.display = which==='over'  ?'block':'none';
        }

// 새 문장을 화면에 건다 (세션 통계는 그대로 이어짐)
        function loadSentence(newText){
            if(newText) state.text=pickText();
            state.pos=0; state.wrongSet={}; state.composing=false;
            el.hiddenInput.value='';
            buildSpans();
            if(state.spans[0]) state.spans[0].className='ch pending current';
            el.composingView.innerHTML='&nbsp;';
            el.targetText.classList.remove('slide-in');
            void el.targetText.offsetWidth;          // 애니메이션 재시작
            el.targetText.classList.add('slide-in');
        }

// 문장을 끝내면 멈추지 않고 바로 다음 문장으로
        function nextSentence(countIt){
            if(countIt){
                state.doneChars += state.text.length;
                state.wrongTotal += Object.keys(state.wrongSet).length;
                state.sentences++;
            }
            loadSentence(true);
            updateStats();
            el.hiddenInput.focus();
        }

// 세션 시작
        function start(){
            state.doneChars=0; state.wrongTotal=0; state.sentences=0;
            state.keystrokes=0; state.startedAt=null;
            state.running=true; state.text='';
            lockControls(true);
            show('run');
            loadSentence(true);
            updateStats();
            setTimeout(function(){ el.hiddenInput.focus(); },30);
            if(state.timerId) clearInterval(state.timerId);
            state.timerId=setInterval(function(){ if(state.startedAt&&state.running) updateStats(); },100);
        }

        function finish(completed){
            if(!state.running) return;
            state.running=false;
            if(state.timerId) clearInterval(state.timerId);
            lockControls(false);
            el.hiddenInput.blur();

            var st=sessionStats();
            var unit=speedUnit();
            var enough = state.sentences>0;          // 한 문장이라도 끝냈는가

            show('result');
            el.resultTitle.textContent='연습 종료';
            el.resSpeed.textContent=st.speed;
            el.resSpeedLabel.textContent=unit;
            el.resAccuracy.textContent=st.acc+'%';
            el.resTime.textContent=st.sec.toFixed(1)+'s';
            el.resultSub.textContent=(state.source==='custom'?'내 문장':(state.lang==='mix'?'한/영 혼합':isKo()?'한글':'영어'))+
                (isMixed()?'':' · '+(state.len==='short'?'짧게':state.len==='medium'?'보통':'길게'))+
                ' · 문장 '+state.sentences+'개 · '+st.typed+'자';

            if(enough){
                var best=loadBest();
                if(!best||st.speed>best.speed){
                    try{ localStorage.setItem(bestKey(),JSON.stringify({speed:st.speed,accuracy:st.acc})); }catch(e){}
                    el.bestNote.textContent='새로운 최고 기록입니다';
                } else {
                    el.bestNote.textContent='최고 기록 '+best.speed+' '+unit+' (정확도 '+best.accuracy+'%)';
                }
                addRecord({kind:'practice', lang:state.lang, src:state.source, len:state.len, speed:st.speed, acc:st.acc});
            } else {
                el.bestNote.textContent='문장을 한 개 이상 끝내야 기록으로 남습니다';
            }
        }

        el.hiddenInput.addEventListener('compositionstart',function(){ state.composing=true; });
        el.hiddenInput.addEventListener('compositionend',function(){ state.composing=false; evaluate(); });
        el.hiddenInput.addEventListener('input',function(e){
            if(!state.running) return;
            if(e.isComposing) state.composing=true;
            if(!state.startedAt) state.startedAt=Date.now();
            evaluate();
        });
        el.hiddenInput.addEventListener('keydown',function(e){
            if(e.key==='Escape'){ e.preventDefault(); finish(false); return; }
            if(e.key==='Enter'){ e.preventDefault(); return; }
            if(!state.running) return;
            if(e.key.length===1||e.key==='Process'||e.keyCode===229) state.keystrokes++;
        });

// 입력칸 자체는 그대로 두고, 글자 영역을 눌러도 입력칸으로 포커스가 가게 한다
        el.targetText.addEventListener('mousedown',function(e){
            e.preventDefault(); el.hiddenInput.focus();
        });
        el.targetText.addEventListener('touchend',function(){ el.hiddenInput.focus(); });

// ================= 내 문장 (텍스트 파일 업로드) =================
        var MAX_SENTENCES=5000, MAX_CHARS=500000;

// 긴 문단은 버리지 않고 공백 단위로 잘라 연속 조각으로 만든다
        function chunkLong(text, limit){
            if(text.length<=limit) return [text];
            var out=[], words=text.split(' '), cur='';
            for(var i=0;i<words.length;i++){
                var w=words[i];
// 한 단어가 한도보다 길면(긴 URL 등) 강제로 자른다
                while(w.length>limit){
                    if(cur){ out.push(cur); cur=''; }
                    out.push(w.slice(0,limit));
                    w=w.slice(limit);
                }
                if(!cur) cur=w;
                else if((cur+' '+w).length<=limit) cur+=' '+w;
                else { out.push(cur); cur=w; }
            }
            if(cur) out.push(cur);
            return out;
        }

        function splitSentences(raw){
            var limit=state.chunk||100;
            var parts = raw
            .replace(/\r/g,'')
            .split(/\n+|(?<=[.!?。])\s+/)
            .map(function(t){ return t.replace(/\s+/g,' ').trim(); })
            .filter(function(t){ return t.length>=2; });

            var out=[];
            for(var i=0;i<parts.length && out.length<MAX_SENTENCES;i++){
                out=out.concat(chunkLong(parts[i], limit));
            }
            return out.slice(0, MAX_SENTENCES);
        }

        function loadCustom(){
            state.custom = lsGet('typing_custom', []);
            el.customText.value = lsGet('typing_custom_raw', '');
            state.chunk = lsGet('typing_chunk', 100);
            setActive(el.chunkSeg,'data-chunk',String(state.chunk));
            renderCustomInfo();
        }

        function renderCustomInfo(){
            el.customInfo.textContent = state.custom.length
                ? '저장된 문장 '+state.custom.length+'개 — 연습에 사용됩니다.'
                : '아직 저장된 문장이 없습니다. 파일을 올리거나 직접 붙여넣으세요. 한글·영문·숫자를 섞어도 됩니다. (최대 50만 자 / 5000문장)';
        }

        function saveCustom(raw){
            var list=splitSentences(raw);
            if(!list.length){
                el.customInfo.textContent='문장을 찾지 못했습니다. 내용을 확인해주세요.';
                return;
            }
            var trimmed = raw.length>MAX_CHARS;
            state.custom=list;
            try{
                lsSet('typing_custom', list);
                lsSet('typing_custom_raw', raw.slice(0,MAX_CHARS));
            }catch(e){
                el.customInfo.textContent='저장 공간이 부족합니다. 글을 조금 줄여주세요.';
                return;
            }
            state.source='custom';
            setActive(el.sourceSeg,'data-source','custom');
            applySource();
            el.customInfo.textContent='문장 '+list.length+'개('+raw.length.toLocaleString()+'자)를 저장했습니다.'+
                (trimmed?' 50만 자를 넘는 부분은 잘렸습니다.':'')+
                (list.length>=MAX_SENTENCES?' 최대 '+MAX_SENTENCES+'개까지만 사용합니다.':'');
        }

// .txt 는 UTF-8 이 아닌 경우(EUC-KR)가 많아 두 번 시도한다
        function readTextFile(file){
            var reader=new FileReader();
            reader.onload=function(){
                var buf=reader.result, text='';
                try{ text=new TextDecoder('utf-8',{fatal:false}).decode(buf); }catch(e){}
                if(!text || text.indexOf('\uFFFD')>=0){
                    try{ text=new TextDecoder('euc-kr').decode(buf); }catch(e){}
                }
                el.customText.value=text;
                saveCustom(text);
            };
            reader.onerror=function(){ el.customInfo.textContent='파일을 읽지 못했습니다.'; };
            reader.readAsArrayBuffer(file);
        }

        function applySource(){
            var custom = state.source==='custom';
            el.customBox.style.display = custom?'block':'none';
            el.lenSeg.style.display = (custom || state.mode==='game')?'none':'flex';
// 내 문장은 한/영이 섞일 수 있으므로 언어 선택이 의미 없다
            el.langSeg.style.display = (custom && state.mode!=='game')?'none':'flex';
        }

        el.sourceSeg.addEventListener('click',function(e){
            var b=e.target.closest('button'); if(!b||b.disabled) return;
            state.source=b.getAttribute('data-source');
            setActive(el.sourceSeg,'data-source',state.source);
            applySource();
        });
        el.chunkSeg.addEventListener('click',function(e){
            var b=e.target.closest('button'); if(!b||b.disabled) return;
            state.chunk=parseInt(b.getAttribute('data-chunk'),10);
            setActive(el.chunkSeg,'data-chunk',String(state.chunk));
            lsSet('typing_chunk', state.chunk);
            var raw=el.customText.value;
            if(raw.trim()) saveCustom(raw);           // 새 길이로 즉시 다시 나눔
        });
        el.uploadBtn.addEventListener('click',function(){ el.fileInput.click(); });
        el.fileInput.addEventListener('change',function(e){
            var f=e.target.files&&e.target.files[0];
            if(f) readTextFile(f);
            e.target.value='';
        });
        el.saveCustomBtn.addEventListener('click',function(){ saveCustom(el.customText.value); });
        el.clearCustomBtn.addEventListener('click',function(){
            state.custom=[]; el.customText.value='';
            lsSet('typing_custom',[]); lsSet('typing_custom_raw','');
            renderCustomInfo();
        });

// ================= 기록 누적 · 연속 접속 =================
        function lsGet(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
        function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
        function dayStr(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }

        function touchStreak(){
            var st=lsGet('typing_streak',{last:'',count:0,best:0});
            var today=dayStr(new Date());
            if(st.last!==today){
                var yest=dayStr(new Date(Date.now()-86400000));
                st.count = (st.last===yest) ? st.count+1 : 1;
                st.last=today;
                if(st.count>(st.best||0)) st.best=st.count;
                lsSet('typing_streak',st);
            }
            return st;
        }

        function addRecord(rec){
            rec.date=dayStr(new Date());
            rec.ts=Date.now();
            var h=lsGet('typing_history',[]);
            h.unshift(rec);
            if(h.length>30) h=h.slice(0,30);
            lsSet('typing_history',h);
            renderStatsPanel();
        }

        function renderStatsPanel(){
            var st=lsGet('typing_streak',{count:1,best:1});
            var h=lsGet('typing_history',[]);
            var today=dayStr(new Date());
            var todayRecs=h.filter(function(r){ return r.date===today && r.kind==='practice'; });
            var todayBest=todayRecs.reduce(function(a,r){ return Math.max(a,r.speed); },0);

            var html='<div class="sp-top">'+
                '<span>연속 접속 <span class="sp-streak">'+st.count+'일째</span>'+
                (st.best>st.count?' <span style="color:#8b8375">(최고 '+st.best+'일)</span>':'')+'</span>'+
                '<span>오늘 최고 <b>'+(todayBest||'-')+'</b></span>'+
                '</div>';

            var recent=h.filter(function(r){ return r.kind==='practice'; }).slice(0,5);
            if(!recent.length){
                html+='<p class="sp-empty">아직 기록이 없습니다. 첫 연습을 시작해보세요.</p>';
            } else {
                var max=recent.reduce(function(a,r){ return Math.max(a,r.speed); },1);
                recent.forEach(function(r){
                    html+='<div class="rec-row">'+
                        '<span class="rec-tag">'+(r.src==='custom'?'내 문장':r.lang==='mix'?'혼합':r.lang==='ko'?'한글':'영어')+' '+r.date.slice(5)+'</span>'+
                        '<span class="rec-bar"><i style="width:'+Math.round(r.speed/max*100)+'%"></i></span>'+
                        '<span class="rec-val">'+r.speed+' '+((r.src==='custom'||r.lang!=='en')?'타':'wpm')+'</span>'+
                        '</div>';
                });
            }
            el.statsPanel.innerHTML=html;
        }

        function copyResult(){
            var t=el.resSpeed.textContent+' '+el.resSpeedLabel.textContent+
                ' / 정확도 '+el.resAccuracy.textContent+
                ' / '+el.resultSub.textContent+
                '\n타자연습 https://gondre.store/typing/';
            var done=function(){
                el.shareBtn.textContent='복사했습니다';
                setTimeout(function(){ el.shareBtn.textContent='기록 복사하기'; },1600);
            };
            if(navigator.clipboard && navigator.clipboard.writeText){
                navigator.clipboard.writeText(t).then(done,function(){ fallbackCopy(t,done); });
            } else { fallbackCopy(t,done); }
        }
        function fallbackCopy(t,cb){
            var ta=document.createElement('textarea');
            ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.select();
            try{ document.execCommand('copy'); cb(); }catch(e){}
            document.body.removeChild(ta);
        }
        el.shareBtn.addEventListener('click',copyResult);

// ================= 낱말 낙하 게임 =================
        var WORDS = {
            ko:{
                1:['하늘','바다','구름','나무','사랑','친구','바람','노래','아침','저녁','시간','마음','가족','행복','여행','커피','우산','연필','창문','계단','골목','강물','노을','눈길','새벽','햇살','바위','들판','도시','편지'],
                2:['컴퓨터','자동차','도서관','운동장','바이올린','신호등','아이스크림','우편함','손목시계','기차역','냉장고','청소기','전화기','사진첩','가로수','지하철','횡단보도','자전거','우체통','세탁기','에어컨','책가방','운동화','손난로'],
                3:['정보통신','유지보수','시설관리','네트워크','데이터베이스','프로그래밍','키보드연습','원격제어','전산실무','보안점검','자료백업','장비교체','회선점검','전력공급','통신설비'],
                4:['가는말이고와야','티끌모아태산','천리길도한걸음','고생끝에낙이온다','시작이반이다','발없는말이천리간다','백지장도맞들면낫다','호랑이도제말하면온다']
            },
            mix:{
                1:['AI','PC방','TV뉴스','USB','와이파이','메일','파일','링크','포털','앱','폴더','서버','마우스','모니터','SNS','QR코드','MP3','PDF'],
                2:['노트북','키보드','프린터','브라우저','다운로드','업데이트','비밀번호','네트워크','바이러스','블루투스','스마트폰','충전기','이어폰','공유기'],
                3:['SSD 교체','IP 주소','Wi-Fi 설정','PDF 변환','CPU 온도','USB 포트','DNS 서버','LAN 케이블','HDMI 연결','VPN 접속'],
                4:['클라우드 백업','데이터베이스 관리','네트워크 트래픽','보안 업데이트 적용','원격 접속 프로그램','서버실 온습도 점검']
            },
            en:{
                1:['sky','road','tree','book','rain','fire','moon','star','wind','song','blue','hand','door','time','cake','ship','gold','leaf','desk','lamp','rock','bird','snow','wave'],
                2:['garden','window','pencil','coffee','purple','silver','forest','planet','bridge','candle','mirror','rocket','summer','island','pocket','ticket','shadow','button'],
                3:['keyboard','umbrella','elephant','mountain','computer','notebook','sandwich','birthday','triangle','vacation','hospital','sunlight','password','yesterday'],
                4:['programming','information','construction','communication','extraordinary','responsibility','understanding','neighborhood']
            }
        };

        var game = {
            running:false, paused:false,
            words:[], score:0, level:1, lives:3, cleared:0,
            lastSpawn:0, lastFrame:0, raf:null, fieldH:0, seq:0
        };

        function levelConf(){
            var L = game.level;
            return {
                speed: 26 + (L-1)*11,                       // px/초
                spawn: Math.max(700, 2300 - (L-1)*160),     // 낱말 생성 간격(ms)
                maxTier: L<3 ? 1 : L<6 ? 2 : L<10 ? 3 : 4   // 길이 등급
            };
        }

        function pickWord(){
            var conf=levelConf(), pool=[];
            for(var t=1;t<=conf.maxTier;t++){
                var list=WORDS[state.lang][t];
                var weight = (t===conf.maxTier)?2:1;        // 최근 해금된 등급이 더 자주
                for(var w=0;w<weight;w++) pool=pool.concat(list);
            }
            return pool[Math.floor(Math.random()*pool.length)];
        }

        function spawnWord(){
            var text=pickWord();
            var node=document.createElement('div');
            node.className='word';
            node.textContent=text;
            node.style.top='-40px';
            el.gameField.appendChild(node);
            var maxLeft = Math.max(4, el.gameField.clientWidth - node.offsetWidth - 8);
            node.style.left = Math.floor(Math.random()*maxLeft)+'px';
            game.words.push({text:text, y:-36, node:node, id:++game.seq});
        }

        function renderWordProgress(){
            var typed = el.gameInput.value;
            game.words.forEach(function(w){
                var hit = typed.length>0 && w.text.indexOf(typed)===0;
                w.node.classList.toggle('hit', hit);
                if(hit){
                    w.node.innerHTML = '<span class="done">'+esc(typed)+'</span>'+esc(w.text.slice(typed.length));
                } else if(w.node.textContent!==w.text){
                    w.node.textContent=w.text;
                }
            });
        }

        function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function clearWord(w, index){
            w.node.classList.add('pop');
            var node=w.node;
            setTimeout(function(){ if(node.parentNode) node.parentNode.removeChild(node); },180);
            game.words.splice(index,1);
            game.score += w.text.length*10 + game.level*5;
            game.cleared++;
            var newLevel = 1 + Math.floor(game.cleared/7);
            if(newLevel>game.level){ game.level=newLevel; flashLevel(); }
            updateGameBar();
        }

        function flashLevel(){
            el.gLevel.style.color='var(--brass)';
            setTimeout(function(){ el.gLevel.style.color=''; },600);
        }

        function loseLife(w, index){
            if(w.node.parentNode) w.node.parentNode.removeChild(w.node);
            game.words.splice(index,1);
            game.lives--;
            updateGameBar();
            el.gameField.style.background='rgba(178,58,47,.14)';
            setTimeout(function(){ el.gameField.style.background=''; },160);
            if(game.lives<=0) endGame();
        }

        function updateGameBar(){
            el.gLevel.textContent=game.level;
            el.gScore.textContent=game.score;
            el.gLives.textContent = new Array(Math.max(0,game.lives)+1).join('♥') || '·';
        }

        function gameLoop(ts){
            if(!game.running){ return; }
            game.raf=requestAnimationFrame(gameLoop);
            if(game.paused){ game.lastFrame=ts; return; }
            if(!game.lastFrame) game.lastFrame=ts;
            var dt=Math.min(100, ts-game.lastFrame)/1000;
            game.lastFrame=ts;

            var conf=levelConf();
            if(ts-game.lastSpawn > conf.spawn){ spawnWord(); game.lastSpawn=ts; }

            var limit = el.gameField.clientHeight - 30;
            for(var i=game.words.length-1;i>=0;i--){
                var w=game.words[i];
                w.y += conf.speed*dt;
                w.node.style.transform='translateY('+w.y+'px)';
                if(w.y>limit) loseLife(w,i);
            }
        }

        function startGame(){
            game.running=true; game.paused=false;
            game.words=[]; game.score=0; game.level=1; game.lives=3; game.cleared=0;
            game.lastSpawn=0; game.lastFrame=0; game.seq=0;
            el.gameField.innerHTML='<div class="ground"></div>';
            el.gameInput.value='';
            el.gPauseBtn.textContent='일시정지';
            lockControls(true);
            show('game');
            updateGameBar();
            setTimeout(function(){ el.gameInput.focus(); },40);
            if(game.raf) cancelAnimationFrame(game.raf);
            game.raf=requestAnimationFrame(gameLoop);
        }

        function endGame(){
            if(!game.running) return;
            game.running=false;
            if(game.raf) cancelAnimationFrame(game.raf);
            lockControls(false);
            el.gameInput.blur();
            show('over');
            el.goScore.textContent=game.score;
            el.goLevel.textContent=game.level;
            el.goWords.textContent=game.cleared;
            el.goSub.textContent=(state.lang==='mix'?'한/영 혼합':isKo()?'한글':'영어')+' 낱말게임';
            var key='typing_game_best_'+state.lang, best=0;
            try{ best=parseInt(localStorage.getItem(key)||'0',10); }catch(e){}
            if(game.score>best){
                try{ localStorage.setItem(key,String(game.score)); }catch(e){}
                el.goBest.textContent='새로운 최고 점수입니다';
            } else {
                el.goBest.textContent='최고 점수 '+best+'점';
            }
            addRecord({kind:'game', lang:state.lang, speed:game.score, level:game.level});
        }

        el.gameInput.addEventListener('input',function(){
            if(!game.running||game.paused) return;
            var typed=el.gameInput.value.trim();
            if(typed){
                for(var i=game.words.length-1;i>=0;i--){
                    if(game.words[i].text===typed){
                        clearWord(game.words[i],i);
                        el.gameInput.value='';
                        break;
                    }
                }
            }
            renderWordProgress();
        });
        el.gameInput.addEventListener('keydown',function(e){
            if(e.key==='Enter'){ e.preventDefault(); el.gameInput.value=''; renderWordProgress(); }
            if(e.key==='Escape'){ e.preventDefault(); endGame(); }
        });

        el.gStopBtn.addEventListener('click',function(){ endGame(); });
        el.gPauseBtn.addEventListener('click',function(){
            if(!game.running) return;
            game.paused=!game.paused;
            el.gPauseBtn.textContent = game.paused?'계속하기':'일시정지';
            if(!game.paused) el.gameInput.focus();
        });
        el.goRetryBtn.addEventListener('click',function(){ startGame(); });
        el.goHomeBtn.addEventListener('click',function(){ renderStatsPanel(); show('start'); lockControls(false); });

// ---- 모드 전환 ----
        function applyMode(){
            var isGame = state.mode==='game';
            el.sourceBoxEl = el.sourceSeg.parentNode;
            el.sourceBoxEl.style.display = isGame?'none':'block';
            el.lenSeg.style.display = (isGame || state.source==='custom')?'none':'flex';
            el.startDesc.innerHTML = isGame
                ? '위에서 떨어지는 낱말을 입력해 없애세요.<br>레벨이 오를수록 빨라지고 낱말도 길어집니다. 하트 3개를 모두 잃으면 종료됩니다.'
                : '문장이 끝나면 다음 문장이 곧바로 이어집니다.<br>중지를 누를 때까지 계속되며, 타수와 정확도는 전체 기준으로 누적됩니다.';
        }
        el.modeSeg.addEventListener('click',function(e){
            var b=e.target.closest('button'); if(!b||b.disabled) return;
            state.mode=b.getAttribute('data-mode');
            setActive(el.modeSeg,'data-mode',state.mode);
            applyMode();
            show('start');
        });

        el.startBtn.addEventListener('click',function(){
            if(state.mode==='game') startGame(); else start();
        });
        el.stopBtn.addEventListener('click',function(){ finish(false); });
        el.restartBtn.addEventListener('click',function(){ start(); });
        el.skipBtn.addEventListener('click',function(){ nextSentence(false); });
        el.retryNewBtn.addEventListener('click',function(){ start(); });
        el.toHomeBtn.addEventListener('click',function(){ renderStatsPanel(); show('start'); lockControls(false); });

        touchStreak();
        loadCustom();
        applySource();
        renderStatsPanel();
        applyMode();
        show('start');
    })();;
</script>
