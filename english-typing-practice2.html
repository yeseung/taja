<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>영어 타자연습 - 발음과 뜻을 함께</title>

    <!-- https://github.com/pastel000101/xkwkdustmq -->

    <meta
            name="description"
            content="영어 단어와 문장을 타이핑하면서 한글 발음과 뜻을 함께 익히는 영어 타자연습입니다."
    >

    <style>
        :root {
            --background: #f7f8fa;
            --surface: #ffffff;
            --surface-soft: #f8fafc;

            --text: #111827;
            --text-light: #6b7280;

            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-soft: #eff6ff;

            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;

            --radius: 18px;
            --shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family:
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    "Noto Sans KR",
                    sans-serif;
            line-height: 1.6;
            word-break: keep-all;
        }

        button,
        select,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        [hidden] {
            display: none !important;
        }

        .app {
            width: min(1100px, calc(100% - 32px));
            margin: 40px auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .header-title {
            margin: 0;
            font-size: clamp(26px, 4vw, 38px);
            letter-spacing: -0.04em;
        }

        .header-description {
            margin: 5px 0 0;
            color: var(--text-light);
            font-size: 15px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .controls {
            display: grid;
            grid-template-columns:
                minmax(160px, 1.1fr)
                repeat(3, minmax(120px, 1fr))
                auto;
            gap: 12px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .control {
            min-width: 0;
        }

        .control-label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 700;
        }

        select {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
        }

        select:focus {
            border-color: var(--primary);
        }

        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 3px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .mode-button {
            height: 36px;
            padding: 0 14px;
            color: var(--text-light);
            background: transparent;
            border: 0;
            border-radius: 9px;
            font-weight: 700;
        }

        .mode-button.active {
            color: #ffffff;
            background: var(--primary);
        }

        .toggle-group {
            display: flex;
            align-items: end;
            gap: 7px;
        }

        .toggle-button,
        .button {
            min-height: 44px;
            padding: 0 15px;
            color: var(--text);
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-weight: 700;
        }

        .toggle-button.active {
            color: var(--primary);
            background: var(--primary-soft);
            border-color: #bfdbfe;
        }

        .button:hover,
        .toggle-button:hover {
            background: var(--surface-soft);
        }

        .button.primary {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .button.primary:hover {
            background: #1d4ed8;
        }

        .button.danger {
            color: var(--danger);
        }

        kbd {
            display: inline-block;
            margin-left: 4px;
            padding: 1px 5px;
            color: var(--text-light);
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 5px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
        }

        .notice {
            margin-bottom: 18px;
            padding: 12px 16px;
            color: #92400e;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 12px;
            font-size: 14px;
        }

        .practice {
            min-height: 390px;
            padding: clamp(24px, 5vw, 60px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .progress {
            margin-bottom: 25px;
            color: var(--text-light);
            font-size: 13px;
            font-weight: 700;
        }

        .pronunciation {
            min-height: 72px;
            margin-bottom: 10px;
        }

        .pronunciation-text {
            margin: 0;
            font-size: clamp(23px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .phoneme-marks {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 27px;
            margin-bottom: 4px;
        }

        .phoneme-mark {
            display: inline-flex;
            align-items: center;
            min-height: 23px;
            padding: 1px 7px;
            color: var(--primary);
            background: var(--primary-soft);
            border: 1px solid #dbeafe;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .target {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 90px;
            margin: 0;
            font-family:
                    "SFMono-Regular",
                    Consolas,
                    "Liberation Mono",
                    monospace;
            font-size: clamp(34px, 7vw, 64px);
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.01em;
            word-break: break-word;
        }

        .target-character.correct {
            color: var(--success);
        }

        .target-character.wrong {
            color: var(--danger);
            text-decoration: underline;
            text-decoration-thickness: 3px;
        }

        .target-character.current {
            background: #dbeafe;
            border-radius: 4px;
        }

        .meaning {
            min-height: 40px;
            margin-top: 18px;
            color: var(--text-light);
            font-size: clamp(17px, 3vw, 22px);
            font-weight: 600;
        }

        .typing-input-wrap {
            width: min(720px, 100%);
            margin: 30px auto 0;
        }

        .typing-input {
            width: 100%;
            height: 58px;
            padding: 0 18px;
            color: var(--text);
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 14px;
            outline: none;
            text-align: center;
            font-size: 20px;
        }

        .typing-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08);
        }

        .typing-help {
            margin: 8px 0 0;
            color: var(--text-light);
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 18px;
        }

        .stat {
            padding: 18px 10px;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 25px;
            font-weight: 800;
        }

        .stat-name {
            color: var(--text-light);
            font-size: 12px;
            font-weight: 700;
        }

        .result {
            margin-top: 18px;
            padding: 25px;
            text-align: center;
        }

        .result-title {
            margin: 0 0 20px;
            font-size: 23px;
        }

        .result-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .footer {
            padding: 18px 4px;
            color: var(--text-light);
            text-align: center;
            font-size: 12px;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
            background: rgba(15, 23, 42, 0.55);
        }

        .modal {
            width: min(720px, 100%);
            max-height: min(700px, calc(100vh - 40px));
            overflow: auto;

            padding: 25px;

            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-title {
            margin: 0;
            font-size: 22px;
        }

        .guide-list {
            display: grid;
            gap: 10px;
        }

        .guide-item {
            padding: 15px;
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .guide-head {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 7px;
        }

        .guide-symbol {
            min-width: 36px;
            color: var(--primary);
            font-size: 22px;
            font-weight: 900;
        }

        .guide-name {
            font-weight: 800;
        }

        .guide-item p {
            margin: 4px 0;
            color: var(--text-light);
            font-size: 13px;
        }

        @media (max-width: 850px) {
            .app {
                width: min(100% - 20px, 720px);
                margin: 20px auto;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }

            .controls {
                grid-template-columns: 1fr 1fr;
            }

            .toggle-group {
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .toggle-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .practice {
                min-height: 350px;
                padding: 30px 16px;
            }

            .target {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <h1 class="header-title">영어 타자연습</h1>
            <p class="header-description">
                타자를 치면서 영어 발음과 뜻을 함께 익혀보세요.
            </p>
        </div>

        <button
                type="button"
                class="button"
                id="guideButton"
        >
            발음 기호
            <kbd>F9</kbd>
        </button>
    </header>

    <section class="controls card">

        <div class="control">
            <span class="control-label">연습 모드</span>

            <div class="mode-buttons">
                <button
                        type="button"
                        class="mode-button active"
                        data-mode="word"
                >
                    단어
                </button>

                <button
                        type="button"
                        class="mode-button"
                        data-mode="sentence"
                >
                    문장
                </button>
            </div>
        </div>

        <div class="control">
            <label
                    class="control-label"
                    for="levelSelect"
            >
                난이도
            </label>

            <select id="levelSelect">
                <option value="all">전체</option>
                <option value="beginner">초급</option>
                <option value="intermediate">중급</option>
                <option value="advanced">고급</option>
            </select>
        </div>

        <div class="control">
            <label
                    class="control-label"
                    for="categorySelect"
            >
                주제
            </label>

            <select id="categorySelect">
                <option value="all">전체</option>
                <option value="daily">일상</option>
                <option value="food">음식</option>
                <option value="travel">여행</option>
                <option value="school">학교</option>
                <option value="work">직장</option>
                <option value="feeling">감정</option>
                <option value="tech">기술</option>
                <option value="nature">자연</option>
            </select>
        </div>

        <div class="control">
            <label
                    class="control-label"
                    for="orderSelect"
            >
                순서
            </label>

            <select id="orderSelect">
                <option value="random">무작위</option>
                <option value="sequential">차례대로</option>
            </select>
        </div>

        <div class="control">
            <span class="control-label">표시</span>

            <div class="toggle-group">
                <button
                        type="button"
                        class="toggle-button"
                        id="pronunciationToggle"
                        aria-pressed="false"
                >
                    발음
                    <kbd>F2</kbd>
                </button>

                <button
                        type="button"
                        class="toggle-button"
                        id="meaningToggle"
                        aria-pressed="false"
                >
                    뜻
                    <kbd>F4</kbd>
                </button>
            </div>
        </div>

    </section>

    <div
            class="notice"
            id="notice"
            hidden
    ></div>

    <main class="practice card">

        <div
                class="progress"
                id="progress"
        ></div>

        <div
                class="pronunciation"
                id="pronunciation"
                hidden
        >
            <div
                    class="phoneme-marks"
                    id="phonemeMarks"
            ></div>

            <p
                    class="pronunciation-text"
                    id="pronunciationText"
            ></p>
        </div>

        <div
                class="target"
                id="target"
                aria-live="polite"
        ></div>

        <div
                class="meaning"
                id="meaning"
                hidden
        ></div>

        <div class="typing-input-wrap">

            <input
                    type="text"
                    class="typing-input"
                    id="typingInput"
                    placeholder="위 내용을 그대로 입력하세요"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
            >

            <p class="typing-help">
                입력이 완료되면 자동으로 결과가 표시됩니다.
            </p>

        </div>

    </main>

    <section
            class="stats"
            aria-label="실시간 기록"
    >
        <div class="stat card">
            <strong
                    class="stat-value"
                    id="wpmValue"
            >
                0
            </strong>
            <span class="stat-name">WPM</span>
        </div>

        <div class="stat card">
            <strong
                    class="stat-value"
                    id="accuracyValue"
            >
                100%
            </strong>
            <span class="stat-name">정확도</span>
        </div>

        <div class="stat card">
            <strong
                    class="stat-value"
                    id="errorValue"
            >
                0
            </strong>
            <span class="stat-name">오타</span>
        </div>

        <div class="stat card">
            <strong
                    class="stat-value"
                    id="timeValue"
            >
                0.0
            </strong>
            <span class="stat-name">초</span>
        </div>
    </section>

    <section
            class="result card"
            id="resultPanel"
            hidden
    >
        <h2 class="result-title">
            연습 완료 🎉
        </h2>

        <p id="resultText"></p>

        <div class="result-actions">

            <button
                    type="button"
                    class="button"
                    id="retryButton"
            >
                다시하기
                <kbd>Esc</kbd>
            </button>

            <button
                    type="button"
                    class="button primary"
                    id="nextButton"
            >
                다음 문항
                <kbd>Enter</kbd>
            </button>

        </div>
    </section>

    <footer class="footer">
        F2 발음 · F4 뜻 · F9 발음 기호 · Enter 다음 문항 · Esc 다시하기
    </footer>

</div>


<div
        class="modal-backdrop"
        id="guideModal"
        hidden
>
    <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="guideTitle"
    >

        <div class="modal-header">

            <h2
                    class="modal-title"
                    id="guideTitle"
            >
                발음 기호 안내
            </h2>

            <button
                    type="button"
                    class="button"
                    id="guideClose"
            >
                닫기
            </button>

        </div>

        <div
                class="guide-list"
                id="guideList"
        ></div>

    </div>
</div>


<!--
    원본 저장소의 데이터 파일을 그대로 사용합니다.

    data/
    ├── phoneme-guide.js
    ├── words.js
    └── sentences.js
-->
<script src="data/phoneme-guide.js"></script>
<script src="data/words.js"></script>
<script src="data/sentences.js"></script>


<script>
    (function () {
        'use strict';

        var appData = window.APP_DATA || {};

        var state = {
            mode: 'word',
            level: 'all',
            category: 'all',
            order: 'random',

            showPronunciation: false,
            showMeaning: false,

            list: [],
            index: 0,
            current: null,

            startedAt: 0,
            finishedAt: 0,
            running: false,

            errors: 0
        };


        var elements = {
            modeButtons: document.querySelectorAll('.mode-button'),

            levelSelect: document.getElementById('levelSelect'),
            categorySelect: document.getElementById('categorySelect'),
            orderSelect: document.getElementById('orderSelect'),

            pronunciationToggle:
                document.getElementById('pronunciationToggle'),

            meaningToggle:
                document.getElementById('meaningToggle'),

            pronunciation:
                document.getElementById('pronunciation'),

            pronunciationText:
                document.getElementById('pronunciationText'),

            phonemeMarks:
                document.getElementById('phonemeMarks'),

            meaning:
                document.getElementById('meaning'),

            target:
                document.getElementById('target'),

            typingInput:
                document.getElementById('typingInput'),

            progress:
                document.getElementById('progress'),

            notice:
                document.getElementById('notice'),

            wpmValue:
                document.getElementById('wpmValue'),

            accuracyValue:
                document.getElementById('accuracyValue'),

            errorValue:
                document.getElementById('errorValue'),

            timeValue:
                document.getElementById('timeValue'),

            resultPanel:
                document.getElementById('resultPanel'),

            resultText:
                document.getElementById('resultText'),

            retryButton:
                document.getElementById('retryButton'),

            nextButton:
                document.getElementById('nextButton'),

            guideButton:
                document.getElementById('guideButton'),

            guideModal:
                document.getElementById('guideModal'),

            guideClose:
                document.getElementById('guideClose'),

            guideList:
                document.getElementById('guideList')
        };


        function init() {

            if (
                !appData.words ||
                !appData.sentences
            ) {
                showNotice(
                    '데이터 파일을 불러오지 못했습니다. data 폴더의 파일 경로를 확인해 주세요.'
                );

                elements.typingInput.disabled = true;

                return;
            }

            bindEvents();

            createGuide();

            rebuildList();

            loadQuestion();
        }


        function bindEvents() {

            elements.modeButtons.forEach(function (button) {

                button.addEventListener('click', function () {

                    var mode = button.getAttribute('data-mode');

                    changeMode(mode);
                });

            });


            elements.levelSelect.addEventListener(
                'change',
                function () {

                    state.level = this.value;

                    resetFilter();
                }
            );


            elements.categorySelect.addEventListener(
                'change',
                function () {

                    state.category = this.value;

                    resetFilter();
                }
            );


            elements.orderSelect.addEventListener(
                'change',
                function () {

                    state.order = this.value;

                    resetFilter();
                }
            );


            elements.pronunciationToggle.addEventListener(
                'click',
                togglePronunciation
            );


            elements.meaningToggle.addEventListener(
                'click',
                toggleMeaning
            );


            elements.typingInput.addEventListener(
                'input',
                onTyping
            );


            elements.retryButton.addEventListener(
                'click',
                retryQuestion
            );


            elements.nextButton.addEventListener(
                'click',
                nextQuestion
            );


            elements.guideButton.addEventListener(
                'click',
                openGuide
            );


            elements.guideClose.addEventListener(
                'click',
                closeGuide
            );


            elements.guideModal.addEventListener(
                'click',
                function (event) {

                    if (event.target === elements.guideModal) {
                        closeGuide();
                    }

                }
            );


            document.addEventListener(
                'keydown',
                onShortcut
            );
        }


        function changeMode(mode) {

            if (
                mode !== 'word' &&
                mode !== 'sentence'
            ) {
                return;
            }

            state.mode = mode;

            elements.modeButtons.forEach(function (button) {

                var active =
                        button.getAttribute('data-mode') === mode;

                button.classList.toggle(
                    'active',
                    active
                );

            });

            resetFilter();
        }


        function resetFilter() {

            state.index = 0;

            rebuildList();

            loadQuestion();
        }


        function rebuildList() {

            var source;

            if (state.mode === 'sentence') {
                source = appData.sentences || [];
            } else {
                source = appData.words || [];
            }

            state.list = source.filter(function (item) {

                var levelMatch =
                        state.level === 'all' ||
                        item.level === state.level;

                var categoryMatch =
                        state.category === 'all' ||
                        item.category === state.category;

                return (
                    levelMatch &&
                    categoryMatch
                );

            });


            if (state.order === 'random') {
                shuffle(state.list);
            }

            if (!state.list.length) {

                state.current = null;

                showNotice(
                    '선택한 조건에 맞는 연습 내용이 없습니다.'
                );

                elements.target.textContent = '내용 없음';

                elements.typingInput.disabled = true;

                return;
            }

            hideNotice();

            elements.typingInput.disabled = false;
        }


        function loadQuestion() {

            if (!state.list.length) {
                return;
            }

            if (state.index >= state.list.length) {

                state.index = 0;

                if (state.order === 'random') {
                    shuffle(state.list);
                }

            }

            state.current =
                state.list[state.index];

            state.startedAt = 0;
            state.finishedAt = 0;
            state.running = false;
            state.errors = 0;

            elements.typingInput.value = '';
            elements.typingInput.disabled = false;

            elements.resultPanel.hidden = true;

            renderQuestion();

            updateStats();

            window.setTimeout(function () {
                elements.typingInput.focus();
            }, 50);
        }


        function renderQuestion() {

            var item = state.current;

            if (!item) {
                return;
            }

            renderTarget('');

            renderPronunciation();

            elements.meaning.textContent =
                item.meaning || '';

            elements.pronunciation.hidden =
                !state.showPronunciation;

            elements.meaning.hidden =
                !state.showMeaning;

            elements.progress.textContent =
                (state.index + 1) +
                ' / ' +
                state.list.length;
        }


        function renderPronunciation() {

            var item = state.current;

            elements.phonemeMarks.innerHTML = '';
            elements.pronunciationText.innerHTML = '';

            if (!item) {
                return;
            }


            if (state.mode === 'word') {

                elements.pronunciationText.textContent =
                    item.hangul || '';

                renderMarks(item.marks || []);

                return;
            }


            if (!item.words) {
                return;
            }


            var pronunciationParts = [];
            var allMarks = [];


            item.words.forEach(function (word) {

                if (word.hangul !== null) {
                    pronunciationParts.push(
                        word.hangul || ''
                    );
                }

                if (word.marks) {

                    word.marks.forEach(function (mark) {
                        allMarks.push(mark);
                    });

                }

            });


            elements.pronunciationText.textContent =
                pronunciationParts.join(' ');

            renderMarks(allMarks);
        }


        function renderMarks(marks) {

            var used = {};


            marks.forEach(function (mark) {

                if (
                    !mark ||
                    !mark.phoneme ||
                    used[mark.phoneme]
                ) {
                    return;
                }


                var guide =
                        appData.phonemeGuide &&
                        appData.phonemeGuide[mark.phoneme];


                if (!guide) {
                    return;
                }


                used[mark.phoneme] = true;


                var span =
                        document.createElement('span');

                span.className =
                    'phoneme-mark';

                span.textContent =
                    guide.symbol +
                    ' ' +
                    guide.label;

                elements.phonemeMarks.appendChild(
                    span
                );
            });
        }


        function onTyping() {

            if (!state.current) {
                return;
            }


            if (!state.running) {

                state.startedAt =
                    performance.now();

                state.running = true;
            }


            var input =
                    elements.typingInput.value;

            var target =
                    state.current.en;


            calculateErrors(
                input,
                target
            );


            renderTarget(input);

            updateStats();


            if (input === target) {
                finishQuestion();
            }
        }


        function renderTarget(input) {

            var target =
                    state.current
                        ? state.current.en
                        : '';


            elements.target.innerHTML = '';


            for (
                var i = 0;
                i < target.length;
                i++
            ) {

                var span =
                        document.createElement('span');

                span.className =
                    'target-character';

                span.textContent =
                    target.charAt(i);


                if (i < input.length) {

                    if (
                        input.charAt(i) ===
                        target.charAt(i)
                    ) {
                        span.classList.add(
                            'correct'
                        );
                    } else {
                        span.classList.add(
                            'wrong'
                        );
                    }

                } else if (
                    i === input.length
                ) {
                    span.classList.add(
                        'current'
                    );
                }


                elements.target.appendChild(
                    span
                );
            }
        }


        function calculateErrors(
            input,
            target
        ) {

            var errors = 0;

            var length =
                    Math.min(
                        input.length,
                        target.length
                    );


            for (
                var i = 0;
                i < length;
                i++
            ) {

                if (
                    input.charAt(i) !==
                    target.charAt(i)
                ) {
                    errors++;
                }

            }


            if (
                input.length >
                target.length
            ) {

                errors +=
                    input.length -
                    target.length;
            }


            state.errors = errors;
        }


        function getStats() {

            var input =
                    elements.typingInput.value;

            var elapsed = 0;


            if (state.startedAt) {

                var end =
                        state.finishedAt ||
                        performance.now();

                elapsed =
                    (end - state.startedAt) /
                    1000;
            }


            var correct = 0;


            if (state.current) {

                for (
                    var i = 0;
                    i < input.length;
                    i++
                ) {

                    if (
                        input.charAt(i) ===
                        state.current.en.charAt(i)
                    ) {
                        correct++;
                    }

                }

            }


            var accuracy =
                    input.length
                        ? Math.round(
                            (
                                correct /
                                input.length
                            ) *
                            100
                        )
                        : 100;


            var minutes =
                    elapsed / 60;


            var words =
                    correct / 5;


            var wpm =
                    minutes > 0
                        ? Math.round(
                            words /
                            minutes
                        )
                        : 0;


            return {
                elapsed: elapsed,
                accuracy: accuracy,
                wpm: wpm,
                errors: state.errors
            };
        }


        function updateStats() {

            var stats =
                    getStats();


            elements.wpmValue.textContent =
                stats.wpm;

            elements.accuracyValue.textContent =
                stats.accuracy + '%';

            elements.errorValue.textContent =
                stats.errors;

            elements.timeValue.textContent =
                stats.elapsed.toFixed(1);
        }


        function finishQuestion() {

            if (!state.running) {
                return;
            }


            state.finishedAt =
                performance.now();

            state.running = false;


            elements.typingInput.disabled =
                true;


            updateStats();


            var stats =
                    getStats();


            elements.resultText.textContent =
                'WPM ' +
                stats.wpm +
                ' · 정확도 ' +
                stats.accuracy +
                '% · 오타 ' +
                stats.errors +
                '개 · ' +
                stats.elapsed.toFixed(1) +
                '초';


            elements.resultPanel.hidden =
                false;


            elements.nextButton.focus();
        }


        function retryQuestion() {

            loadQuestion();
        }


        function nextQuestion() {

            state.index++;

            loadQuestion();
        }


        function togglePronunciation() {

            state.showPronunciation =
                !state.showPronunciation;


            elements.pronunciationToggle.classList.toggle(
                'active',
                state.showPronunciation
            );


            elements.pronunciationToggle.setAttribute(
                'aria-pressed',
                state.showPronunciation
                    ? 'true'
                    : 'false'
            );


            elements.pronunciation.hidden =
                !state.showPronunciation;
        }


        function toggleMeaning() {

            state.showMeaning =
                !state.showMeaning;


            elements.meaningToggle.classList.toggle(
                'active',
                state.showMeaning
            );


            elements.meaningToggle.setAttribute(
                'aria-pressed',
                state.showMeaning
                    ? 'true'
                    : 'false'
            );


            elements.meaning.hidden =
                !state.showMeaning;
        }


        function createGuide() {

            var guide =
                    appData.phonemeGuide || {};


            elements.guideList.innerHTML =
                '';


            Object.keys(guide).forEach(
                function (key) {

                    var item =
                            guide[key];


                    var container =
                            document.createElement('article');

                    container.className =
                        'guide-item';


                    var head =
                            document.createElement('div');

                    head.className =
                        'guide-head';


                    var symbol =
                            document.createElement('span');

                    symbol.className =
                        'guide-symbol';

                    symbol.textContent =
                        item.symbol;


                    var name =
                            document.createElement('span');

                    name.className =
                        'guide-name';

                    name.textContent =
                        item.label;


                    head.appendChild(symbol);
                    head.appendChild(name);

                    container.appendChild(head);


                    addGuideParagraph(
                        container,
                        item.articulation
                    );


                    if (item.confusedWith) {

                        addGuideParagraph(
                            container,
                            '구분: ' +
                            item.confusedWith
                        );

                    }


                    if (item.example) {

                        addGuideParagraph(
                            container,
                            '예: ' +
                            item.example
                        );

                    }


                    elements.guideList.appendChild(
                        container
                    );

                }
            );
        }


        function addGuideParagraph(
            container,
            text
        ) {

            if (!text) {
                return;
            }


            var paragraph =
                    document.createElement('p');

            paragraph.textContent =
                text;

            container.appendChild(
                paragraph
            );
        }


        function openGuide() {

            elements.guideModal.hidden =
                false;
        }


        function closeGuide() {

            elements.guideModal.hidden =
                true;

            elements.typingInput.focus();
        }


        function onShortcut(event) {

            if (event.key === 'F2') {

                event.preventDefault();

                togglePronunciation();

                return;
            }


            if (event.key === 'F4') {

                event.preventDefault();

                toggleMeaning();

                return;
            }


            if (event.key === 'F9') {

                event.preventDefault();

                if (elements.guideModal.hidden) {
                    openGuide();
                } else {
                    closeGuide();
                }

                return;
            }


            if (
                event.key === 'Escape'
            ) {

                if (!elements.guideModal.hidden) {

                    closeGuide();

                    return;
                }


                retryQuestion();

                return;
            }


            if (
                event.key === 'Enter' &&
                !elements.resultPanel.hidden
            ) {

                event.preventDefault();

                nextQuestion();
            }
        }


        function shuffle(array) {

            for (
                var i = array.length - 1;
                i > 0;
                i--
            ) {

                var j =
                        Math.floor(
                            Math.random() *
                            (i + 1)
                        );


                var temp =
                        array[i];

                array[i] =
                    array[j];

                array[j] =
                    temp;
            }

        }


        function showNotice(message) {

            elements.notice.textContent =
                message;

            elements.notice.hidden =
                false;
        }


        function hideNotice() {

            elements.notice.hidden =
                true;
        }


        init();

    })();
</script>

</body>
</html>
